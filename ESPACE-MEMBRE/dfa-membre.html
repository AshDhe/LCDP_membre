<!doctype html>
<html lang="fr" data-lcdp-css="c024 c085 c034 c038 c032 c031 c036 c037 c083 c033 c041 c040 c073 c079 c080 c082">
<head>

  <title>Dotation financière annuelle - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dotation financière annuelle individuelle La Clé du Parc.">

  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const joindre = (base, chemin) => String(base || "").replace(/\/+$/, "") + "/" + String(chemin).replace(/^\/+/, "");
      const publicBase = cfg.publicBaseUrl || cfg.PUBLIC_BASE || "";
      const membreBase = cfg.membreBaseUrl || cfg.MEMBRE_BASE || cfg.siteBase || "";
      const objetBase = cfg.objetBaseUrl || cfg.OBJET_BASE || joindre(publicBase, "/OBJET");
      window.SITE_BASE = membreBase;
      window.LCDP_urlPublic = path => typeof cfg.publicUrl === "function" ? cfg.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof cfg.membreUrl === "function" ? cfg.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof cfg.objetUrl === "function" ? cfg.objetUrl(path) : joindre(objetBase, path);
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-central-mobile-first.css?v=20261126-da27f214') + '">');
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-dfa-membre.css?v=11457ae') + '">');
    })();
  </script>
  <script src="./boutique-accessoires-cadre.js?v=20261126" defer></script>
  <script src="./dfa-membre.js?v=20261126-dfa-editorial-v3" defer></script>
</head>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

              </svg>
                  </button>
                  <div class="lcdp-actions-centrees lcdp-editorial-cta">

                  </div>
                </form>

                  <button type="button" class="lcdp-button lcdp-button-primary lcdp-button--haut-etroit lcdp-editorial-action-button lcdp-button--deux-niveaux" id="dfa-reprendre" hidden><span>Reprendre<br><strong>le paiement</strong></span></button>
                  <button type="button" class="lcdp-button lcdp-button-secondary" id="dfa-annuler" hidden>Annuler la demande</button>
                </div>

          </div>

    </main>
