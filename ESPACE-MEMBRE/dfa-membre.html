<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c032 c036 c037 c083 c033 c041 c040 c073 c079 c080 c082">
<head>
  <meta charset="utf-8">

  <title>Dotation financière annuelle - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dotation financière annuelle individuelle La Clé du Parc.">

  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const joindre = (base, chemin) => String(base || "").replace(/\/+$/, "") + "/" + String(chemin).replace(/^\/+/, "");
      const publicBase = cfg.publicBaseUrl || cfg.PUBLIC_BASE || "";
      const membreBase = cfg.membreBaseUrl || cfg.MEMBRE_BASE || cfg.siteBase || "";
      const objetBase = cfg.objetBaseUrl || cfg.OBJET_BASE || joindre(publicBase, "/OBJET");
      window.SITE_BASE = membreBase;
      window.LCDP_urlPublic = path => typeof cfg.publicUrl === "function" ? cfg.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof cfg.membreUrl === "function" ? cfg.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof cfg.objetUrl === "function" ? cfg.objetUrl(path) : joindre(objetBase, path);
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-central-mobile-first.css?v=20261126-da27f214') + '">');
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-dfa-membre.css?v=b92b39e') + '">');
    })();
  </script>
  <script src="./boutique-accessoires-cadre.js?v=20261126" defer></script>
  <script src="./dfa-membre.js?v=20261126-dfa-tailwind-v2" defer></script>
</head>

<body class="lcdp-app-page">
  <div class="lcdp-site-page lcdp-app-wrapper">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section id="dfa-page" aria-labelledby="dfa-titre">
        <header class="dfa-header">
          <h1 id="dfa-titre">Dotation financière annuelle</h1>
          <p id="dfa-bonjour" class="dfa-intro" hidden></p>
        </header>
        <div class="dfa-card">
          <p id="dfa-statut" class="dfa-status" role="status" aria-live="polite">Chargement…</p>
          <form id="formulaire-dfa-membre" class="dfa-form" aria-labelledby="dfa-choix" hidden>
            <h2 class="dfa-label" id="dfa-choix">Choisissez votre dotation</h2>
            <p class="dfa-hint" id="dfa-aide">Sélectionnez un montant de 10 € à 150 € à l’aide du pavé numérique.</p>
            <button type="button" class="dfa-amount" id="dfa-montant" aria-describedby="dfa-aide" aria-haspopup="dialog">
              <span id="dfa-valeur" class="dfa-value">Montant en euros</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <rect x="4" y="2.5" width="16" height="19" rx="3"></rect><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18.5h.01M12 18.5h4"></path>
              </svg>
            </button>
            <button type="submit" class="dfa-button dfa-primary" id="dfa-enregistrer" disabled>Enregistrer la dotation</button>
          </form>
          <div id="dfa-actions" class="dfa-actions" hidden>
            <button type="button" class="dfa-button dfa-primary" id="dfa-reprendre" hidden>Reprendre le paiement</button>
            <button type="button" class="dfa-button dfa-danger" id="dfa-annuler" hidden>Annuler la demande</button>
          </div>
        </div>
        <button type="button" id="dfa-retour" class="dfa-button dfa-secondary dfa-back">Retour boutique</button>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

</body>
</html>
