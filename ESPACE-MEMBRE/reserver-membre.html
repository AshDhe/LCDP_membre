<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c037 c046 c075 c076 c077 c033 c036 c066 c071">
<head>
  <meta charset="utf-8">

  <title>Réserver - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choisir un parc et réserver une nouvelle date dans votre espace membre La Clé du Parc.">

  <style>
    /* Amorçage du spinner avant disponibilité des feuilles CSS distantes. */
    #lcdp-planifier-attente-initiale { position: fixed; inset: 0; z-index: 2147483646; display: flex; align-items: center; justify-content: center; background: #fff; }
    #lcdp-planifier-attente-initiale .lcdp-loading-spinner { position: relative; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; box-sizing: border-box; }
    #lcdp-planifier-attente-initiale .lcdp-loading-spinner > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #lcdp-planifier-attente-initiale .lcdp-loading-spinner__track { color: rgba(6,95,70,.10); }
    #lcdp-planifier-attente-initiale .lcdp-loading-spinner__arc { color: #e59834; animation: lcdp-planifier-spinner-tourne .8s linear infinite; }
    #lcdp-planifier-attente-initiale .lcdp-loading-spinner__dot { width: 8px; height: 8px; border-radius: 50%; background: #4e6838; }
    @keyframes lcdp-planifier-spinner-tourne { to { transform: rotate(360deg); } }
    /* Attente ABO-RÉZA : même spinner HTML que PLANIFIER, sans GIF externe. */
    body > .lcdp-planifier-partage-attente:has(> .lcdp-loading-spinner) {
      position: fixed; inset: 0; z-index: 2147483000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.92);
    }
    .lcdp-planifier-partage-attente > .lcdp-loading-spinner {
      position: relative; box-sizing: border-box; display: flex;
      flex: 0 0 auto; align-items: center; justify-content: center;
      width: 64px; height: 64px;
    }
    .lcdp-planifier-partage-attente > .lcdp-loading-spinner > svg {
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
    }
    .lcdp-planifier-partage-attente .lcdp-loading-spinner__track { color: rgba(6,95,70,.10); }
    .lcdp-planifier-partage-attente .lcdp-loading-spinner__arc {
      color: #e59834; animation: lcdp-planifier-spinner-tourne .8s linear infinite;
    }
    .lcdp-planifier-partage-attente .lcdp-loading-spinner__dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4e6838;
    }
    @media (prefers-reduced-motion: reduce) {
      #lcdp-planifier-attente-initiale .lcdp-loading-spinner__arc,
      .lcdp-planifier-partage-attente .lcdp-loading-spinner__arc { animation: none; }
    }
  </style>

  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") {
          return config.publicUrl(path);
        }

        return buildUrl(publicBase, path);
      };

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        if (typeof config.membreUrl === "function") {
          return config.membreUrl(path);
        }

        return buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") {
          return config.objetUrl(path);
        }

        return buildUrl(objetBase, path);
      };

      // Le spinner de PLANIFIER est un SVG inline, comme celui de l’accueil membre.

      const feuillesCssObjet = [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css?v=20261110-statut-exclusif-v2",
        "/CSSBASE/lcdp-planifier.css?v=20261112-police-pictos-v1",
         "/CSSBASE/lcdp-ui-badges.css?v=20261111-convergence-v1",
        "/CSSBASE/lcdp-lightbox-convergence.css?v=20261111-wrapper-planifier-v5"
      ];

      feuillesCssObjet.forEach((chemin) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(chemin) +
          '">'
        );
      });

      document.write(
        '<script src="' +
        window.LCDP_urlObjet("/JSBASE/03-galerie.js") +
        '"><\/script>'
      );
      document.write(
        '<script src="' + window.LCDP_urlObjet("/JSBASE/07-diginum.js?v=20261029-compact-sans-logo-v3") + '"><\/script>'
      );
    })();
    document.write('<script data-lcdp-footer-autonome src="' + window.LCDP_urlObjet('/JSBASE/02-footer.js') + '"><\/script>');
  </script>



</head>

<body class="lcdp-app-page lcdp-page-reserver">
  <div class="lcdp-attente-plein-ecran" id="lcdp-planifier-attente-initiale" role="status" aria-label="Chargement du planning mensuel">
    <div class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
  </div>
  <script>
    // Secours autonome : même si un script applicatif ou un service reste bloqué,
    // l'écran de chargement initial ne doit jamais rester indéfiniment.
    window.setTimeout(() => {
      const attente = document.getElementById('lcdp-planifier-attente-initiale');
      if (!attente || !attente.isConnected) return;
      attente.setAttribute('role', 'alert');
      attente.setAttribute('aria-label', 'Chargement du planning interrompu');
      attente.replaceChildren();
      const panneau = document.createElement('div');
      Object.assign(panneau.style, {maxWidth:'430px',padding:'30px',textAlign:'center',
        fontFamily:'Arial,sans-serif',color:'#333',lineHeight:'1.5'});
      const message = document.createElement('p');
      message.textContent = 'Le planning ne répond pas. Vous pouvez réessayer sans perdre votre commande en cours.';
      const relancer = document.createElement('button');
      relancer.type = 'button';
      relancer.textContent = 'Réessayer';
      Object.assign(relancer.style,{padding:'12px 24px',border:'0',borderRadius:'12px',
        background:'#4e6838',color:'#fff',fontSize:'16px',cursor:'pointer'});
      relancer.addEventListener('click', () => window.location.reload());
      panneau.append(message, relancer);
      attente.append(panneau);
    }, 16000);
  </script>
  <div class="lcdp-site-page lcdp-app-wrapper lcdp-planifier-wrapper">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Réserver une date">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-page-content--avec-entete lcdp-stack-large">

            <header class="lcdp-page-header">
              <p class="lcdp-mention-connexion" id="mention-statut-membre" aria-live="polite"></p>
              <p class="lcdp-planifier-parc-en-tete lcdp-ui-badge lcdp-ui-badge--neutral lcdp-ui-badge--context" id="lcdp-planifier-parc-en-tete" aria-live="polite">Aucun parc sélectionné</p>
            </header>

            <!-- Calendrier permanent : dans le corps du wrapper, jamais dans le slot des dialogues. -->
            <div id="lcdp-planifier-calendrier-slot" aria-label="Planning mensuel"></div>

            <!-- ABO-RÉZA : étapes internes au wrapper permanent ; header/footer conservés. -->
            <div id="lcdp-aboreza-workflow-slot" aria-label="Parcours abonnement ABO-RÉZA" hidden></div>

            <!-- Vue Parcs : même wrapper, même largeur, calendrier toujours monté. -->
            <div id="lcdp-planifier-parcs-vue" aria-label="Parcs du département" hidden></div>

            <!-- Fiche et planning du parc : quatrième vue du wrapper PLANIFIER. -->
            <div id="lcdp-planifier-fiche-overlay-slot" aria-label="Fiche et planning du parc" hidden></div>

            <!-- Choix des plages : troisième vue de la même coque, sans modale ni fond grisé. -->
            <div id="lcdp-planifier-jour-overlay-slot" aria-label="Choix des plages horaires" hidden></div>

            <p class="lcdp-text-strong-lead" id="titre-parcs-departement" hidden>
              Parcs près de chez vous
            </p>

            <div
              id="lcdp-commande-bar-reserver-slot"
              hidden
              aria-hidden="true"
            >
              <button class="lcdp-button lcdp-button-primary" type="button" id="bouton-changer-departement">
                CHANGER
              </button>

              <button class="lcdp-button lcdp-button-orange" type="button" id="bouton-voir-carte">
                CARTE
              </button>
            </div>

            <div id="lcdp-liste-card-parcs-slot" hidden></div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
    <!-- Réponses et attentes JavaScript : exclusivement dans le wrapper. -->
    <div id="lcdp-planifier-dialogues-slot" aria-label="Dialogues et notifications"></div>

  </div>

  <script src="./attente-planifier.js?v=20261111-wrapper-dialogues-v2"></script>
  <script src="./reserver-membre.js?v=20261112-police-pictos-v1"></script>
  <script src="./paiement-membre.js?v=20261111-wrapper-dialogues-v2"></script>
  <script src="./aboreza-membre.js?v=20261111-wrapper-dialogues-v2"></script>
</body>
</html>
