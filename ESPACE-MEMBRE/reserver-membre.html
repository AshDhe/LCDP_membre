<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Réserver - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choisir un parc et réserver une nouvelle date dans votre espace membre La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") {
          return config.publicUrl(path);
        }

        return buildUrl(publicBase, path);
      };

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        if (typeof config.membreUrl === "function") {
          return config.membreUrl(path);
        }

        return buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") {
          return config.objetUrl(path);
        }

        return buildUrl(objetBase, path);
      };

      const feuillesCssObjet = [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/02-box-menu-burger.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-dialogue-bouton.css",
        "/BOX/04-box-card-abonnement.css",
        "/BOX/02-box-footer.css",
        "/BOX/02-box-wraper-footer.css",
        "/BOX/03-box-champ-formulaire.css",
        "/BOX/03-box-galerie.css",
        "/BOX/04-box-dialogue-champ.css",
        "/BOX/04-box-liste-card.css",
        "/BOX/pictowait.css?v=20260717-0712",
        "/BOX/04-box-commande-bar.css",
        "/BOX/04-box-card-parc.css",
        "/BOX/04-box-card-map-parc.css",
        "/BOX/04-carte-dynamique.css",
        "/BOX/04-box-fiche-parc.css",
        "/BOX/04-box-shift-detail-parc.css",
        "/BOX/04-box-calendrier-mois.css",
        "/BOX/04-box-card-jour-in-calendrier-mois.css?v=20260717-0655",
        "/BOX/04-box-calendrier-jour.css",
        "/BOX/04-box-card-heure-in-calendrier-jour.css",
        "/BOX/04-box-workflow-reservation.css",
        "/BOX/04-box-listemails.css"
      ];

      feuillesCssObjet.forEach((chemin) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(chemin) +
          '">'
        );
      });

      document.write(
        '<script src="' +
        window.LCDP_urlObjet("/BOX/03-box-galerie.js") +
        '"><\/script>'
      );
    })();
    document.write('<script data-lcdp-footer-autonome src="' + window.LCDP_urlObjet('/BOX/02-box-footer.js') + '"><\/script>');
  </script>
  <style>
    /* En-tête du planning général : n'affecte pas les autres calendriers. */
    .lcdp-page-reserver .lcdp-planifier-entete-filtres {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 14px;
      min-width: 0;
    }
    .lcdp-page-reserver .lcdp-planifier-entete-filtres [data-lcdp-calendrier-mois-title] {
      margin: 0;
    }
    .lcdp-page-reserver .lcdp-planifier-actions-filtres {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .lcdp-page-reserver .lcdp-planifier-filtre {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 86px;
      min-height: 29px;
      padding: 4px 7px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      font: inherit;
      font-size: 0.73rem;
      font-weight: 650;
      line-height: 1.15;
      white-space: nowrap;
      cursor: pointer;
      box-sizing: border-box;
    }
    .lcdp-page-reserver .lcdp-planifier-filtre--acces { background: var(--lcdp-color-orange); }
    .lcdp-page-reserver .lcdp-planifier-filtre--parc { background: var(--lcdp-color-logo-green, #43834a); }
    .lcdp-page-reserver .lcdp-planifier-filtre svg { display: block; width: 15px; height: 15px; flex: 0 0 15px; color: inherit; }
    .lcdp-page-reserver .lcdp-planifier-filtre:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    @media (min-width: 768px) {
      .lcdp-page-reserver [data-lcdp-calendrier-mois-current] { zoom: .9; }
    }
    @media (max-width: 767px) {
      .lcdp-page-reserver .lcdp-planifier-entete-filtres {
        flex-direction: column;
        gap: 8px;
      }
    }

    /* Filtres PLANIFIER : exceptions limitées à ces deux dialogues. */
    .lcdp-planifier-acces-option { display:inline-flex; align-self:flex-start; align-items:center; gap:9px; padding:7px 11px; border-radius:var(--lcdp-radius-small); font-size:0.9rem; font-weight:700; color:white; cursor:pointer; }
    .lcdp-planifier-acces-option input { width:18px; height:18px; margin:0; flex:none; accent-color:var(--lcdp-color-primary); }
    .lcdp-planifier-acces-option--famille { background:var(--lcdp-color-logo-green); }
    .lcdp-planifier-acces-option--coach { background:var(--lcdp-color-coach); }
    .lcdp-planifier-acces-option--famille-coach { background:#80583d; }
    .lcdp-planifier-parcs-card { width:min(calc(100vw - 36px),720px); max-height:calc(100svh - 36px); overflow-y:auto; }
    .lcdp-planifier-parcs-card .lcdp-box-dialogue-champ__content { max-height:none; }
    .lcdp-planifier-parcs-card .lcdp-box-liste-card { text-align:left; }
  </style>
</head>

<body>
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Réserver une date">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-page-content--avec-entete lcdp-stack-large">

            <header class="lcdp-page-header">
              <h1 class="lcdp-title-page-center">Réserver</h1>

              <p class="lcdp-mention-connexion">
                [Espace membre de l'application]
              </p>

              <p class="lcdp-mention-connexion" id="mention-statut-membre" aria-live="polite">
                [Chargement du statut membre]
              </p>
            </header>

            <p class="lcdp-text-strong-lead" id="titre-parcs-departement" hidden>
              Parcs près de chez vous
            </p>

            <div
              id="lcdp-commande-bar-reserver-slot"
              hidden
              aria-hidden="true"
            >
              <button class="lcdp-button lcdp-button-primary" type="button" id="bouton-changer-departement">
                Changer de département
              </button>

              <button class="lcdp-button lcdp-button-orange" type="button" id="bouton-demander-ia">
                Rechercher avec l'IA
              </button>
            </div>

            <div id="lcdp-liste-card-parcs-slot" hidden></div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script src="./reserver-membre.js?v=20261028-planifier-v4"></script>
</body>
</html>
