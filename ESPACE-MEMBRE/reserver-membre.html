<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Réserver - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choisir un parc et réserver une nouvelle date dans votre espace membre La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") {
          return config.publicUrl(path);
        }

        return buildUrl(publicBase, path);
      };

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        if (typeof config.membreUrl === "function") {
          return config.membreUrl(path);
        }

        return buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") {
          return config.objetUrl(path);
        }

        return buildUrl(objetBase, path);
      };

      // Précharger le SVG utilisé dès le clic sur PLANIFIER.
      const preloadAttentePlanifier = document.createElement("link");
      preloadAttentePlanifier.rel = "preload";
      preloadAttentePlanifier.as = "image";
      preloadAttentePlanifier.href = window.LCDP_urlObjet("/BOX/pictowait.svg");
      document.head.appendChild(preloadAttentePlanifier);

      const feuillesCssObjet = [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/02-box-menu-burger.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-dialogue-bouton.css",
        "/BOX/04-box-card-abonnement.css",
        "/BOX/04-box-card-recaporder.css?v=20261031-recapi-v2",
        "/BOX/04-box-workflow-abonnement.css",
        "/BOX/04-box-calendrier-an.css",
        "/BOX/02-box-footer.css",
        "/BOX/02-box-wraper-footer.css",
        "/BOX/03-box-champ-formulaire.css",
        "/BOX/03-box-galerie.css",
        "/BOX/04-box-dialogue-champ.css",
        "/BOX/04-box-liste-card.css",
        "/BOX/pictowait.css?v=20260717-0712",
        "/BOX/04-box-commande-bar.css",
        "/BOX/04-box-card-parc.css",
        "/BOX/04-box-card-map-parc.css",
        "/BOX/04-carte-dynamique.css",
        "/BOX/04-box-fiche-parc.css",
        "/BOX/04-box-shift-detail-parc.css",
        "/BOX/04-box-calendrier-mois.css",
        "/BOX/04-box-legende.css?v=20261029-sans-trait-v3",
        "/BOX/07-box-diginum.css?v=20261029-compact-sans-logo-v3",
        "/BOX/04-box-card-jour-in-calendrier-mois.css?v=20260717-0655",
        "/BOX/04-box-calendrier-jour.css",
        "/BOX/04-box-card-heure-in-calendrier-jour.css",
        "/BOX/04-box-workflow-reservation.css?v=20261102-croix-focus-v1",
        "/BOX/04-box-listemails.css"
      ];

      feuillesCssObjet.forEach((chemin) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(chemin) +
          '">'
        );
      });

      document.write(
        '<script src="' +
        window.LCDP_urlObjet("/BOX/03-box-galerie.js") +
        '"><\/script>'
      );
      document.write(
        '<script src="' + window.LCDP_urlObjet("/BOX/07-box-diginum.js?v=20261029-compact-sans-logo-v3") + '"><\/script>'
      );
    })();
    document.write('<script data-lcdp-footer-autonome src="' + window.LCDP_urlObjet('/BOX/02-box-footer.js') + '"><\/script>');
  </script>

  <style>
    /* PLANIFIER : attente initiale, independante du chargement du CSS des objets. */
    #lcdp-planifier-attente-initiale {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    #lcdp-planifier-attente-initiale img { display: block; width: 64px; height: 64px; object-fit: contain; }

    /* Header du calendrier mensuel : reprend les composants deja fonctionnels. */
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-calendrier-mois__header {
      padding: 18px 52px 16px 18px;
      background: #fff;
      border-bottom: 1px solid #e9eae6 !important;
      border-radius: 22px 22px 0 0;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-entete-filtres {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      min-width: 0;
      gap: 12px;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-entete-identite {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
      min-width: 0;
      width: 100%;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-entete-parc {
      min-width: 0;
      flex: 1 1 180px;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-entete-parc [data-lcdp-calendrier-mois-title] {
      display: block;
      margin: 0 0 3px;
      padding: 0;
      font-size: 11px !important;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: left;
      text-transform: uppercase;
      color: #ba7424 !important;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-entete-filtres:not(.lcdp-planifier-entete-avec-parc) [data-lcdp-calendrier-mois-title] {
      font-size: clamp(1.5rem, 4vw, 2rem) !important;
      letter-spacing: normal;
      color: #181b18 !important;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-nom-parc:not([hidden]) {
      margin: 0;
      padding: 0;
      font-size: clamp(1.2rem, 3vw, 1.45rem) !important;
      line-height: 1.25;
      color: #181b18 !important;
      overflow-wrap: anywhere;
      font-weight: 800 !important;
      text-align: left;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-departement-parc:not([hidden]) {
      display: inline-flex !important;
      align-items: center;
      flex: 0 1 auto;
      max-width: 100%;
      margin: 2px 0 0;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f1f1ee;
      color: #50534f;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 600;
      overflow-wrap: anywhere;
      text-align: left;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-departement-parc:not([hidden])::before {
      content: '📍';
      margin-right: 4px;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-legende-autorisations {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 10px 12px;
      box-sizing: border-box;
      background: #f8f9f6;
      border: 1px solid #e8eae5;
      border-radius: 14px;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-legende-autorisations .lcdp-box-legende__contenu,
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-legende-autorisations .lcdp-box-legende__ligne {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px 16px;
      margin: 0;
      padding: 0;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-filtre-categorie {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-filtre-categorie__input {
      flex: 0 0 15px;
      width: 15px;
      height: 15px;
      margin: 0;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-filtre-categorie .lcdp-box-legende__carre {
      display: inline-block;
      flex: 0 0 9px;
      width: 9px;
      height: 9px;
      min-width: 9px;
      min-height: 9px;
      padding: 0;
      border: 0;
      border-radius: 50%;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-filtre-categorie__coche {
      display: none;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-filtre-categorie .lcdp-box-legende__libelle {
      font-size: 11px;
      font-weight: 650;
      color: #50534f;
      white-space: normal;
    }

    /* Spinner propre au chargement des donnees du calendrier mensuel. */
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-attente-mois {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,.93);
      border-radius: inherit;
      pointer-events: auto;
    }
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-attente-mois .lcdp-pictowait,
    #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-attente-mois .lcdp-pictowait__image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      flex: none;
    }
    @media (max-width: 520px) {
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-calendrier-mois__header {
        padding: 12px 42px 12px 10px;
        border-radius: 16px 16px 0 0;
      }
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-entete-filtres { gap: 9px; }
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-planifier-legende-autorisations { padding: 8px; }
    }

    /* PLANIFIER uniquement : grille mensuelle moins dense sur tablette et ordinateur.
       Ne modifie ni les cinq plages, ni leur statut, ni les interactions. */
    @media (min-width: 768px) {
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-calendrier-mois__card {
        max-width: 860px;
      }
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-calendrier-mois__grid,
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-calendrier-mois__weekdays {
        gap: 11px;
      }
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-card-jour-in-calendrier-mois {
        padding: 7px;
      }
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-card-jour-in-calendrier-mois__number {
        margin-bottom: 5px;
      }
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-card-jour-in-calendrier-mois__slots {
        width: calc(100% - 10px);
        margin-inline: auto;
        gap: 3px;
      }
      #lcdp-lightbox-slot [data-lcdp-box-calendrier-mois] .lcdp-box-card-jour-in-calendrier-mois__slot {
        min-height: 10px;
      }
    }
    /* Sur mobile, conserver les sept colonnes et leurs surfaces tactiles. */
  </style>

</head>

<body>
  <div id="lcdp-planifier-attente-initiale" role="status" aria-label="Chargement du planning mensuel">
    <script>
      (() => {
        const image = new Image(64, 64);
        image.alt = "";
        image.style.visibility = "hidden";
        image.onload = () => { image.style.visibility = "visible"; };
        image.onerror = () => { image.style.display = "none"; };
        image.src = window.LCDP_urlObjet('/BOX/pictowait.svg');
        document.currentScript.parentNode.insertBefore(image, document.currentScript);
      })();
    </script>
  </div>
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Réserver une date">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-page-content--avec-entete lcdp-stack-large">

            <header class="lcdp-page-header">
              <h1 class="lcdp-title-page-center">PLANIFIER</h1>

              <p class="lcdp-mention-connexion" id="mention-statut-membre" aria-live="polite"></p>
            </header>

            <p class="lcdp-text-strong-lead" id="titre-parcs-departement" hidden>
              Parcs près de chez vous
            </p>

            <div
              id="lcdp-commande-bar-reserver-slot"
              hidden
              aria-hidden="true"
            >
              <button class="lcdp-button lcdp-button-primary" type="button" id="bouton-changer-departement">
                Changer de département
              </button>

              <button class="lcdp-button lcdp-button-orange" type="button" id="bouton-voir-carte">
                Voir sur la carte
              </button>
            </div>

            <div id="lcdp-liste-card-parcs-slot" hidden></div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script src="./attente-planifier.js?v=20261102-1"></script>
  <script src="./reserver-membre.js?v=20261030-rezabo-composants-v5"></script>
  <script src="./paiement-membre.js?v=20261031-paiement-ux-v2"></script>
  <script src="./aboreza-membre.js?v=20261031-formulaire-informations-v2"></script>
</body>
</html>
