<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membre abonné - La Clé du Parc</title>
  <meta name="description" content="Accès membre abonné - La Clé du Parc.">
  <script src="../config.js"></script>
  <script>
    (() => {
      "use strict";
      const config = window.SITE_CONFIG || {};
      const base = String(config.objetBaseUrl || config.OBJET_BASE ||
        (String(config.publicBaseUrl || config.PUBLIC_BASE || "").replace(/\/+$/, "") + "/OBJET")).replace(/\/+$/, "");
      for (const chemin of ["/CSSBASE/cssbase.css", "/CSSBASE/lcdp-central-mobile-first.css"]) {
        const lien = document.createElement("link");
        lien.rel = "stylesheet";
        lien.href = base + chemin;
        document.head.appendChild(lien);
      }
    })();
  </script>
</head>
<body>
  <div class="lcdp-site-page">
    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Membre abonné">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large">
            <h1 class="lcdp-title-page-center">Membre abonné</h1>
            <p>Le parcours de cette page reste à définir.</p>
            <a class="lcdp-button lcdp-button-secondary" href="./accueil-membre.html">Retour à l'accueil membre</a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
