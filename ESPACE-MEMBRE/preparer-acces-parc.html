<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Préparez votre accès au parc — La Clé du Parc</title>
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/CSSBASE/cssbase.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/03-box-formulaire.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/01-box-text.css">
  <style>
    [data-lcdp-boxtext],
    #titre-preparation,
    [data-lcdp-boxtext-content],
    #preparation-contenu p,
    #statut-geolocalisation,
    #confirmation-geolocalisation { text-align: center; }
    #preparation-contenu .lcdp-box-formulaire__actions,
    #confirmation-geolocalisation form {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
  <script src="preparer-acces-parc.js" defer></script>
</head>
<body>
  <div class="lcdp-site-page">
    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-labelledby="titre-preparation">
        <div class="lcdp-page-container">
          <div class="lcdp-component lcdp-box-formulaire-page">
            <div class="lcdp-box-formulaire-page__inner">
              <section class="lcdp-component lcdp-boxtext" data-lcdp-boxtext>
                <h1 class="lcdp-boxtext__title" id="titre-preparation">Préparez votre accès au parc</h1>
                <div class="lcdp-boxtext__content" data-lcdp-boxtext-content>
                  <div id="preparation-contenu">
                    <div id="preparation-qr"><p>Avant votre visite, préparez votre téléphone.</p>
                    <p>Scannez ce QR code pour autoriser la géolocalisation.</p>
                    <p><img id="qr-geolocalisation" width="220" height="220" alt="QR code à scanner avec votre téléphone" style="display:block;max-width:100%;height:auto;margin:24px auto"></p>
                    </div>
                    <p id="consigne-autorisation">Ou bien autorisez maintenant depuis votre téléphone.</p>
                    <div class="lcdp-box-formulaire__actions">
                      <button type="button" class="lcdp-button" id="autoriser-geolocalisation">Autoriser</button>
                    </div>
                    <div class="lcdp-box-formulaire__actions" style="margin-top:36px">
                      <button type="button" class="lcdp-button lcdp-button-secondary" id="plus-tard-geolocalisation">Plus tard</button>
                    </div>
                  </div>
                  <p id="statut-geolocalisation" role="status" aria-live="polite"></p>
                  <dialog id="confirmation-geolocalisation" style="border:1px solid #cdd2cd;border-radius:22px;padding:28px;max-width:calc(100% - 48px);color:#1f2a24">
                    <p>La géolocalisation est autorisée sur ce téléphone.</p>
                    <form method="dialog"><button class="lcdp-button">OK</button></form>
                  </dialog>
                </div>
              </section>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
