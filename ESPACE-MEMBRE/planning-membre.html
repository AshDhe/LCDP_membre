<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c032 c083 c036 c037 c058 c072 c073 c063 c064 c077">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Clé du Parc — Espace membre</title>
  <script src="../config.js"></script>
  <script>
    (() => {
      "use strict";
      const config = window.SITE_CONFIG || {};
      const nettoyer = value => String(value || "").replace(/\/+$/, "");
      const joindre = (base, path) => nettoyer(base) + "/" + String(path || "").replace(/^\/+/, "");
      const membreBase = nettoyer(config.membreBaseUrl || config.MEMBRE_BASE || config.siteBase || "");
      const publicBase = nettoyer(config.publicBaseUrl || config.PUBLIC_BASE || "");
      const objetBase = nettoyer(config.objetBaseUrl || config.OBJET_BASE || joindre(publicBase, "/OBJET"));

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;
      window.LCDP_urlPublic = path => typeof config.publicUrl === "function" ? config.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof config.membreUrl === "function" ? config.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof config.objetUrl === "function" ? config.objetUrl(path) : joindre(objetBase, path);

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css",
        "/CSSBASE/lcdp-planifier.css",
        "/CSSBASE/lcdp-navigation-onglets.css",
        "/CSSBASE/lcdp-carte-acces-visuel.css"
      ].forEach(path => {
        // Comme sur mes-informations.html : conserver l'ordre de cascade CSS
        // avant le style de page, sans chargement asynchrone concurrent.
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(path) + '">');
      });
    })();
  </script>
  <link rel="stylesheet" href="./alerte-planifier.css">
  <style>
    /* Masquer toute la coque tant que les fragments et données ne sont pas prêts. */
    #mention-statut-membre[hidden] { display:none !important; }
    html:not(.lcdp-planning-membre-ready) body.lcdp-app-page > .lcdp-app-wrapper {
      visibility: hidden !important;
    }
    #lcdp-planning-attente {
      position: fixed; inset: 0; z-index: 2147483000;
      display: flex; justify-content: center; align-items: center;
      background: #fff;
    }
    html.lcdp-planning-membre-ready #lcdp-planning-attente { display: none; }
    #lcdp-planning-attente .lcdp-loading-spinner {
      width: 64px; height: 64px; display:flex; position:relative; align-items:center; justify-content:center;
    }
    #lcdp-planning-attente .lcdp-loading-spinner > svg {
      position:absolute; inset:0; width:100%; height:100%;
    }
    #lcdp-planning-attente .lcdp-loading-spinner__track { color:rgba(6,95,70,.1); }
    #lcdp-planning-attente .lcdp-loading-spinner__arc {
      color:#e59834; animation:lcdp-planning-attente-tourne .8s linear infinite;
    }
    #lcdp-planning-attente .lcdp-loading-spinner__dot {
      width:8px;height:8px;border-radius:50%;background:#4e6838;
    }
    @keyframes lcdp-planning-attente-tourne { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) {
      #lcdp-planning-attente .lcdp-loading-spinner__arc { animation:none; }
    }
  </style>
</head>
<body class="lcdp-app-page lcdp-mes-acces-page">
  <div id="lcdp-planning-attente" role="status" aria-label="Chargement du planning">
    <div class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
  </div>
  <div class="lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main" aria-label="Planning de l'espace membre">
      <section class="lcdp-page-section">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content">
            <header class="lcdp-page-header"><p id="mention-statut-membre" class="lcdp-mention-connexion lcdp-etiquette-statut-membre" aria-live="polite" hidden></p></header>
            <div id="lcdp-planning-calendrier-slot"></div>
          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>

  <script src="./planning-membre.js"></script>
</body>
</html>
