<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c037">
<head>
  <meta charset="utf-8">
  <title>MES ACCÈS - La Clé du Parc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mes accès - espace membre La Clé du Parc.">

  <script src="../config.js"></script>
  <script>
    (() => {
      "use strict";
      const config = window.SITE_CONFIG || {};
      const nettoyer = value => String(value || "").replace(/\/+$/, "");
      const joindre = (base, path) => nettoyer(base) + "/" + String(path || "").replace(/^\/+/, "");
      const membreBase = nettoyer(config.membreBaseUrl || config.MEMBRE_BASE || config.siteBase || "");
      const publicBase = nettoyer(config.publicBaseUrl || config.PUBLIC_BASE || "");
      const objetBase = nettoyer(config.objetBaseUrl || config.OBJET_BASE || joindre(publicBase, "/OBJET"));

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;
      window.LCDP_urlPublic = path => typeof config.publicUrl === "function" ? config.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof config.membreUrl === "function" ? config.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof config.objetUrl === "function" ? config.objetUrl(path) : joindre(objetBase, path);

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css?v=20261106-mes-acces-wrapper",
      ].forEach(path => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = window.LCDP_urlObjet(path);
        document.head.appendChild(link);
      });
    })();
  </script>
  <!-- Spinner d'arrivée : pictogramme SVG commun, sans nouvelle feuille CSS. -->
  <style>
    #lcdp-attente-arrivee { position:fixed; inset:0; z-index:2147483646; display:flex; align-items:center; justify-content:center; background:#fff; }
    #lcdp-attente-arrivee .lcdp-loading-spinner { position:relative; box-sizing:border-box; width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
    #lcdp-attente-arrivee .lcdp-loading-spinner > svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #lcdp-attente-arrivee .lcdp-loading-spinner__track { color:rgba(6,95,70,.10); }
    #lcdp-attente-arrivee .lcdp-loading-spinner__arc { color:#e59834; animation:lcdp-arrivee-rotation .8s linear infinite; }
    #lcdp-attente-arrivee .lcdp-loading-spinner__dot { width:8px; height:8px; border-radius:50%; background:#4e6838; }
    @keyframes lcdp-arrivee-rotation { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #lcdp-attente-arrivee .lcdp-loading-spinner__arc { animation:none; } }
  </style>
  <noscript><style>#lcdp-attente-arrivee { display:none !important; }</style></noscript>
</head>
<body class="lcdp-app-page">
  <div id="lcdp-attente-arrivee" role="status" aria-label="Chargement de la page">
    <div class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
  </div>
  <script>
    (() => {
      const terminer = () => document.getElementById('lcdp-attente-arrivee')?.remove();
      window.LCDP_terminerAttenteArrivee = terminer;
      // Sécurité : ne pas bloquer définitivement l'accès en cas d'échec d'un fragment/API.
      window.setTimeout(terminer, 15000);
      window.addEventListener('pageshow', event => { if (event.persisted) terminer(); });
    })();
  </script>

             href="./accueil-membre.html"
             data-site-href="/ESPACE-MEMBRE/accueil-membre.html"
             data-space="membre"
             aria-label="Accueil espace membre La Clé du Parc">
            <img class="lcdp-box-bandeau-nav__logo"
                 src="../OBJET/IMAG/LOGO/logo-bandeau-2.webp"
                 data-site-src="/OBJET/IMAG/LOGO/logo-bandeau-2.webp"
                 alt="" width="96" height="96" loading="eager" fetchpriority="high" decoding="async">
            <span class="lcdp-box-bandeau-nav__space-label" data-lcdp-bandeau-nav-label>Espace membre</span>
          </a>
          <div class="lcdp-box-bandeau-nav__burger-slot" data-lcdp-burger-slot></div>
        </div>
      </header>
    </div>

    <!-- MES ACCÈS : enveloppe de page et composants existants, sans calendrier. -->
    <main class="lcdp-site-main" aria-label="Mes accès">
      <section class="lcdp-page-section" aria-label="Contenu de Mes accès">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large lcdp-contenu-editorial lcdp-box-liste-card--encadree"

  <script>
    (() => {
      "use strict";
      function routes(racine) {
        racine.querySelectorAll("[data-site-href]").forEach(element => {
          const path = element.dataset.siteHref || "";
          const route = element.dataset.space === "membre" ? window.LCDP_urlMembre : window.LCDP_urlPublic;
          element.setAttribute("href", route(path));
        });
        racine.querySelectorAll("[data-site-src]").forEach(element => {
          const path = (element.dataset.siteSrc || "").replace(/^\/?OBJET\/?/, "/");
          element.setAttribute("src", window.LCDP_urlObjet(path));
        });
      }

      async function chargerFragment(slot, url) {
        const reponse = await fetch(url, { method: "GET", credentials: "omit", cache: "no-cache" });
        if (!reponse.ok) throw new Error("Composant indisponible : " + url);
        const html = await reponse.text();
        const template = document.createElement("template");
        template.innerHTML = html.trim();
        if (!template.content.firstElementChild) throw new Error("Composant vide : " + url);
        slot.replaceChildren(template.content.cloneNode(true));
        routes(slot);
      }

      async function initialiserBandeau() {
        const slot = document.getElementById("lcdp-bandeau-slot");
        routes(slot);
        try {
          await chargerFragment(slot, window.LCDP_urlMembre("/ESPACE-MEMBRE/box-bandeau-nav-membre.html"));
        } catch (erreur) {
          console.warn("[MES ACCÈS] Bandeau de secours conservé :", erreur);
        }
        try {
          if (typeof window.LCDP_initialiserMenuBurgerMembre !== "function") {
            const script = document.createElement("script");
            script.src = window.LCDP_urlMembre("/ESPACE-MEMBRE/box-menu-burger-membre.js");
            await new Promise((resolve, reject) => {
              script.onload = resolve;
              script.onerror = () => reject(new Error("Menu membre indisponible"));
              document.body.appendChild(script);
            });
          }
          if (typeof window.LCDP_initialiserMenuBurgerMembre === "function") {
            const cookieAbonne = document.cookie.split(";").map(cookie => cookie.trim()).find(cookie => cookie.startsWith("abonne="));
            const abonne = Boolean(cookieAbonne && cookieAbonne.slice("abonne=".length));
            await window.LCDP_initialiserMenuBurgerMembre({etatMembre: {abonne}});
          }
        } catch (erreur) {
          console.warn("[MES ACCÈS] Menu burger non initialisé :", erreur);
        }
      }

      async function initialiserFooter() {
        const slot = document.getElementById("lcdp-footer-slot");
        routes(slot);
        try {
          await chargerFragment(slot, window.LCDP_urlObjet("/HTMLBASE/02-footer.html"));
        } catch (erreur) {
          console.warn("[MES ACCÈS] Footer de secours conservé :", erreur);
        }
      }

      // Chargements indépendants : l'échec de l'un ne supprime jamais l'autre.
      function initialiser() {
        void initialiserBandeau();
        void initialiserFooter();
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initialiser, {once: true});
      } else {
        initialiser();
      }
    })();
  </script>

  <script>
    (() => {
      function observerPremierAffichage() {
        const message = document.getElementById('lcdp-mes-acces-message');
        if (!message) { window.LCDP_terminerAttenteArrivee(); return; }
        const observer = new MutationObserver(verifier);
        function verifier() {
          if (!document.getElementById('lcdp-attente-arrivee')) { observer.disconnect(); return; }
          const texte = (message.textContent || '').trim();
          const termine = message.hidden || (texte && !/^Chargement\b/i.test(texte));
          const bandeauPret = Boolean(document.querySelector('#lcdp-bandeau-slot [data-lcdp-burger-button]'));
          const footerPret = Boolean(document.querySelector('#lcdp-footer-slot [data-lcdp-box-footer]'));
          if (termine && bandeauPret && footerPret) {
            observer.disconnect();
            window.LCDP_terminerAttenteArrivee();
          }
        }
        observer.observe(document.body, {subtree:true,childList:true,attributes:true,characterData:true});
        verifier();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', observerPremierAffichage, {once:true});
      else observerPremierAffichage();
    })();
  </script>
  <script src="./mes-acces-membre.js?v=20261105-6"></script>
</body>
