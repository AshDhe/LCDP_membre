<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MES ACCÈS - La Clé du Parc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mes accès - espace membre La Clé du Parc.">

  <script src="../config.js"></script>
  <script>
    (() => {
      "use strict";
      const config = window.SITE_CONFIG || {};
      const nettoyer = value => String(value || "").replace(/\/+$/, "");
      const joindre = (base, path) => nettoyer(base) + "/" + String(path || "").replace(/^\/+/, "");
      const membreBase = nettoyer(config.membreBaseUrl || config.MEMBRE_BASE || config.siteBase || "");
      const publicBase = nettoyer(config.publicBaseUrl || config.PUBLIC_BASE || "");
      const objetBase = nettoyer(config.objetBaseUrl || config.OBJET_BASE || joindre(publicBase, "/OBJET"));

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;
      window.LCDP_urlPublic = path => typeof config.publicUrl === "function" ? config.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof config.membreUrl === "function" ? config.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof config.objetUrl === "function" ? config.objetUrl(path) : joindre(objetBase, path);

      [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/02-box-menu-burger.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-footer.css",
        "/BOX/04-box-liste-card.css",
        "/BOX/04-box-commande-bar.css",
        "/BOX/03-box-champ-formulaire.css",
        "/BOX/04-box-liste-card-diaporama.css",
        "/BOX/04-box-card-parc-diaporama.css"
      ].forEach(path => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = window.LCDP_urlObjet(path);
        document.head.appendChild(link);
      });
    })();
  </script>
</head>
<body>
  <div class="lcdp-site-page">

    <!-- Bandeau existant intégré dès le rendu HTML : visible même en cas d'échec du chargement des fragments. -->
    <div id="lcdp-bandeau-slot">
      <header class="lcdp-box-bandeau-nav" data-lcdp-box-bandeau-nav>
        <div class="lcdp-box-bandeau-nav__inner">
          <a class="lcdp-box-bandeau-nav__logo-link"
             href="./accueil-membre.html"
             data-site-href="/ESPACE-MEMBRE/accueil-membre.html"
             data-space="membre"
             aria-label="Accueil espace membre La Clé du Parc">
            <img class="lcdp-box-bandeau-nav__logo"
                 src="../OBJET/IMAG/LOGO/logo-bandeau-2.webp"
                 data-site-src="/OBJET/IMAG/LOGO/logo-bandeau-2.webp"
                 alt="" width="96" height="96" loading="eager" fetchpriority="high" decoding="async">
            <span class="lcdp-box-bandeau-nav__space-label" data-lcdp-bandeau-nav-label>Espace membre</span>
          </a>
          <div class="lcdp-box-bandeau-nav__burger-slot" data-lcdp-burger-slot></div>
        </div>
      </header>
    </div>

    <!-- MES ACCÈS : enveloppe de page et composants existants, sans calendrier. -->
    <main class="lcdp-site-main" aria-label="Mes accès">
      <section class="lcdp-page-section" aria-label="Contenu de Mes accès">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large lcdp-contenu-editorial lcdp-box-liste-card--encadree"
               id="lcdp-mes-acces-page-conteneur">
            <header class="lcdp-page-header">
              <h1 class="lcdp-title-page-center">MES ACCÈS</h1>
            </header>

            <section class="lcdp-box-liste-card" id="lcdp-mes-acces-conteneur" aria-label="Réservations d'accès planifiés">
              <div class="lcdp-box-liste-card__header">
                <div class="lcdp-box-liste-card__commande">
                  <div class="lcdp-planning-membre-periode-tabs" role="tablist" aria-label="Période de vos accès">
                    <button type="button" class="lcdp-button lcdp-button-primary lcdp-planning-membre-periode-button"
                            data-lcdp-periode="avenir" role="tab" aria-selected="true">À venir</button>
                    <button type="button" class="lcdp-button lcdp-button-secondary lcdp-planning-membre-periode-button"
                            data-lcdp-periode="passe" role="tab" aria-selected="false">Passé</button>
                  </div>
                </div>
              </div>

              <section class="lcdp-box-liste-card__tools" id="lcdp-mes-acces-filtres" aria-label="Filtres des accès planifiés">
                <div class="lcdp-box-commande-bar">
                  <div class="lcdp-box-commande-bar__actions" role="group" aria-label="Filtrer les accès à venir">
                    <label class="lcdp-box-champ-formulaire" style="flex:1 1 145px;min-width:0;width:auto">
                      <span class="lcdp-box-champ-formulaire__label">Date</span>
                      <input id="lcdp-mes-acces-date" type="date" aria-label="Filtrer par date">
                    </label>
                    <label class="lcdp-box-champ-formulaire" style="flex:1 1 145px;min-width:0;width:auto">
                      <span class="lcdp-box-champ-formulaire__label">Parc</span>
                      <select id="lcdp-mes-acces-parc" aria-label="Filtrer par parc"><option value="">Tous les parcs</option></select>
                    </label>
                    <label class="lcdp-box-champ-formulaire" style="flex:1 1 130px;min-width:0;width:auto">
                      <span class="lcdp-box-champ-formulaire__label">Département</span>
                      <select id="lcdp-mes-acces-departement" aria-label="Filtrer par département"><option value="">Tous les départements</option></select>
                    </label>
                  </div>
                </div>
                <div class="lcdp-box-commande-bar">
                  <div class="lcdp-box-commande-bar__actions" role="group" aria-label="Invitations">
                    <button type="button" class="lcdp-button lcdp-button-secondary" id="lcdp-mes-acces-recues" aria-pressed="false">INVT reçues</button>
                    <button type="button" class="lcdp-button lcdp-button-secondary" id="lcdp-mes-acces-envoyees" aria-pressed="false" disabled>Invitations envoyées</button>
                    <button type="button" class="lcdp-button lcdp-button-secondary" id="lcdp-mes-acces-effacer" disabled>Effacer les filtres</button>
                  </div>
                </div>
              </section>

              <p id="lcdp-mes-acces-resultat" role="status" aria-live="polite" class="lcdp-mention-connexion"></p>
              <p id="lcdp-mes-acces-message" role="status" aria-live="polite" class="lcdp-box-liste-card__message">Chargement de vos accès…</p>
              <div class="lcdp-box-liste-card-diaporama" aria-label="Liste des accès">
                <div class="lcdp-box-liste-card-diaporama__list" id="lcdp-mes-acces-liste"></div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer existant, avec version minimale de secours. -->
    <div id="lcdp-footer-slot">
      <footer class="lcdp-box-footer" data-lcdp-box-footer>
        <div class="lcdp-box-footer__inner">
          <a href="../ESPACE-PUBLIC/mentions-legales.html" data-site-href="/ESPACE-PUBLIC/mentions-legales.html">Mentions légales - Données</a>
        </div>
      </footer>
    </div>
    <div id="lcdp-lightbox-slot"></div>
  </div>

  <script>
    (() => {
      "use strict";
      function routes(racine) {
        racine.querySelectorAll("[data-site-href]").forEach(element => {
          const path = element.dataset.siteHref || "";
          const route = element.dataset.space === "membre" ? window.LCDP_urlMembre : window.LCDP_urlPublic;
          element.setAttribute("href", route(path));
        });
        racine.querySelectorAll("[data-site-src]").forEach(element => {
          const path = (element.dataset.siteSrc || "").replace(/^\/?OBJET\/?/, "/");
          element.setAttribute("src", window.LCDP_urlObjet(path));
        });
      }

      async function chargerFragment(slot, url) {
        const reponse = await fetch(url, { method: "GET", credentials: "omit", cache: "no-cache" });
        if (!reponse.ok) throw new Error("Composant indisponible : " + url);
        const html = await reponse.text();
        const template = document.createElement("template");
        template.innerHTML = html.trim();
        if (!template.content.firstElementChild) throw new Error("Composant vide : " + url);
        slot.replaceChildren(template.content.cloneNode(true));
        routes(slot);
      }

      async function initialiserBandeau() {
        const slot = document.getElementById("lcdp-bandeau-slot");
        routes(slot);
        try {
          await chargerFragment(slot, window.LCDP_urlMembre("/ESPACE-MEMBRE/box-bandeau-nav-membre.html"));
        } catch (erreur) {
          console.warn("[MES ACCÈS] Bandeau de secours conservé :", erreur);
        }
        try {
          if (typeof window.LCDP_initialiserMenuBurgerMembre !== "function") {
            const script = document.createElement("script");
            script.src = window.LCDP_urlMembre("/ESPACE-MEMBRE/box-menu-burger-membre.js");
            await new Promise((resolve, reject) => {
              script.onload = resolve;
              script.onerror = () => reject(new Error("Menu membre indisponible"));
              document.body.appendChild(script);
            });
          }
          if (typeof window.LCDP_initialiserMenuBurgerMembre === "function") {
            const cookieAbonne = document.cookie.split(";").map(cookie => cookie.trim()).find(cookie => cookie.startsWith("abonne="));
            const abonne = Boolean(cookieAbonne && cookieAbonne.slice("abonne=".length));
            await window.LCDP_initialiserMenuBurgerMembre({etatMembre: {abonne}});
          }
        } catch (erreur) {
          console.warn("[MES ACCÈS] Menu burger non initialisé :", erreur);
        }
      }

      async function initialiserFooter() {
        const slot = document.getElementById("lcdp-footer-slot");
        routes(slot);
        try {
          await chargerFragment(slot, window.LCDP_urlObjet("/BOX/02-box-footer.html"));
        } catch (erreur) {
          console.warn("[MES ACCÈS] Footer de secours conservé :", erreur);
        }
      }

      // Chargements indépendants : l'échec de l'un ne supprime jamais l'autre.
      function initialiser() {
        void initialiserBandeau();
        void initialiserFooter();
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initialiser, {once: true});
      } else {
        initialiser();
      }
    })();
  </script>
  <script src="./mes-acces-membre.js?v=20261105-2"></script>
</body>
</html>
