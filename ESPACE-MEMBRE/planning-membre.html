<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c032 c083 c036 c037 c040 c054 c058 c065 c072 c073 c063 c064 c077">
<head>

  <title>La Clé du Parc — Espace membre</title>
  <script src="../config.js"></script>
  <script>
    (() => {
      "use strict";
      const config = window.SITE_CONFIG || {};
      const nettoyer = value => String(value || "").replace(/\/+$/, "");
      const joindre = (base, path) => nettoyer(base) + "/" + String(path || "").replace(/^\/+/, "");
      const membreBase = nettoyer(config.membreBaseUrl || config.MEMBRE_BASE || config.siteBase || "");
      const publicBase = nettoyer(config.publicBaseUrl || config.PUBLIC_BASE || "");
      const objetBase = nettoyer(config.objetBaseUrl || config.OBJET_BASE || joindre(publicBase, "/OBJET"));

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;
      window.LCDP_urlPublic = path => typeof config.publicUrl === "function" ? config.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof config.membreUrl === "function" ? config.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof config.objetUrl === "function" ? config.objetUrl(path) : joindre(objetBase, path);

      [
        "/CSSBASE/cssbase.css?interface=spinner-officiel",
        "/CSSBASE/lcdp-central-mobile-first.css",
        "/CSSBASE/lcdp-central-module-06.css",
        "/CSSBASE/lcdp-planifier.css",
        "/CSSBASE/lcdp-navigation-onglets.css",
        "/CSSBASE/lcdp-carte-acces-visuel.css",
        "/CSSBASE/lcdp-lightbox-convergence.css",
        "/CSSBASE/lcdp-mes-acces-membre.css",
        "/CSSBASE/lcdp-fiche-parc-wrapper.css?v=20261113-wrapper-unique-v9",
        "/CSSBASE/lcdp-fiche-parc-vue-carte.css?v=20261113-wrapper-unique-v9"
      ].forEach(path => {
        // Comme sur mes-informations.html : conserver l'ordre de cascade CSS
        // avant le style de page, sans chargement asynchrone concurrent.
        const versionVue = path.endsWith("/lcdp-mes-acces-membre.css") ? "?v=20261113-ajouter-retabli-v17" : "";
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(path) + versionVue + '">');
      });
      document.write('<script src="' + window.LCDP_urlObjet('/JSBASE/03-galerie.js') + '"><\/script>');
    })();
  </script>
  <link rel="stylesheet" href="./alerte-planifier.css?v=20261113-acces-entree-v1">
  <style>
    /* Masquer toute la coque tant que les fragments et données ne sont pas prêts. */
    #mention-statut-membre[hidden] { display:none !important; }
    #lcdp-planning-calendrier-slot[hidden], #lcdp-mes-acces-fiche-slot[hidden] { display:none !important; }

      visibility: hidden !important;

      background: #fff;
    }
    html.lcdp-planning-membre-ready #lcdp-planning-attente { display: none; }
    /* Même spinner officiel à l'ouverture d'Inviter, sans écran bloquant. */
    .lcdp-invitation-attente {
      display:flex; width:100%; min-height:55vh; align-items:center; justify-content:center;
    }
    #lcdp-planning-attente .lcdp-loading-spinner,

      width:64px; height:64px; display:flex; position:relative; align-items:center; justify-content:center;

    #lcdp-planning-attente .lcdp-loading-spinner > svg,
    .lcdp-invitation-attente .lcdp-loading-spinner > svg {
      position:absolute; inset:0; width:100%; height:100%;

    #lcdp-planning-attente .lcdp-loading-spinner__track,

    #lcdp-planning-attente .lcdp-loading-spinner__dot,

    @keyframes lcdp-planning-attente-tourne { to { transform:rotate(360deg); } }

      #lcdp-planning-attente .lcdp-loading-spinner__arc,
      .lcdp-invitation-attente .lcdp-loading-spinner__arc { animation:none; }

      /* D-ACTIF : vue réservée au titulaire d'un accès. */

    .lcdp-dactif-valider {margin-top:15px;min-height:43px;}
    /* Verso des acces : Annuler / Acces, puis Invites / D-ACTIF. */
    #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite .lcdp-planning-verso-actions {
      display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;

      gap:7px!important;
    }

      width:100%!important;min-width:0!important;flex-wrap:nowrap!important;
    }
    #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite .lcdp-planning-verso-action {
      flex:0 1 auto!important;font-weight:600!important;gap:6px!important;
      padding:7px 11px!important;min-height:34px!important;white-space:nowrap!important;
    }
    #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite .lcdp-planning-verso-ligne-acces

      flex:0 0 80px!important;width:80px!important;min-width:80px!important;
      max-width:80px!important;height:34px!important;min-height:34px!important;
      padding:6px 10px!important;margin:0!important;
      border:1px solid rgba(75,99,51,.35)!important;border-radius:16px!important;
      background:#fff!important;color:#4b6333!important;
      font-size:12px!important;font-weight:600!important;line-height:1.2!important;
    }
    #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite
      .lcdp-planning-verso-ligne-acces :is(.lcdp-planning-verso-annuler,.lcdp-planning-verso-acces-bouton):hover {
      border-color:#4b6333!important;background:#4b6333!important;color:#fff!important;
    }
    #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite
      .lcdp-planning-verso-dactif {
      border-color:#e5b843!important;background:#fff8e8!important;color:#5d4520!important;
    }
    @media(max-width:600px) {
      /* Libelles Fiche parc / Carte reduits de 12 % sans changer les pictos. */
      #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite
        .lcdp-planning-verso-liens .lcdp-box-card-parc__action-libelle {

      }
    }
    @media(max-width:370px) {
      #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite .lcdp-planning-verso-action {

      }
      #lcdp-planning-calendrier-slot .lcdp-planning-carte-visite

        flex-basis:74px!important;width:74px!important;min-width:74px!important;max-width:74px!important;
      }
