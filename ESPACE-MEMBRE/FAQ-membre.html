<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c032 c083 c036 c033 c037 c041 c040 p0fdefe76cf13">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FAQ de l'espace membre La Clé du Parc.">
  <title>FAQ membre - La Clé du Parc</title>
  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const join = (base, path) => String(base || '').replace(/\/+$/,'') + '/' + String(path || '').replace(/^\/+/, '');
      const publicBase = cfg.publicBaseUrl || cfg.PUBLIC_BASE || '';
      const memberBase = cfg.membreBaseUrl || cfg.MEMBRE_BASE || cfg.siteBase || '';
      const objetBase = cfg.objetBaseUrl || cfg.OBJET_BASE || join(publicBase, '/OBJET');
      window.LCDP_urlMembre = path => typeof cfg.membreUrl === 'function' ? cfg.membreUrl(path) : join(memberBase, path);
      window.LCDP_urlPublic = path => typeof cfg.publicUrl === 'function' ? cfg.publicUrl(path) : join(publicBase, path);
      window.LCDP_urlObjet = path => typeof cfg.objetUrl === 'function' ? cfg.objetUrl(path) : join(objetBase, path);
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-central-mobile-first.css') + '">');
    })();
  </script>
  <!-- Spinner d'arrivée : pictogramme SVG commun, sans nouvelle feuille CSS. -->
  <style>
    #lcdp-attente-arrivee { position:fixed; inset:0; z-index:2147483646; display:flex; align-items:center; justify-content:center; background:#fff; }
    #lcdp-attente-arrivee .lcdp-loading-spinner { position:relative; box-sizing:border-box; width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
    #lcdp-attente-arrivee .lcdp-loading-spinner > svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #lcdp-attente-arrivee .lcdp-loading-spinner__track { color:rgba(6,95,70,.10); }
    #lcdp-attente-arrivee .lcdp-loading-spinner__arc { color:#e59834; animation:lcdp-arrivee-rotation .8s linear infinite; }
    #lcdp-attente-arrivee .lcdp-loading-spinner__dot { width:8px; height:8px; border-radius:50%; background:#4e6838; }
    @keyframes lcdp-arrivee-rotation { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #lcdp-attente-arrivee .lcdp-loading-spinner__arc { animation:none; } }
  </style>
  <noscript><style>#lcdp-attente-arrivee { display:none !important; }</style></noscript>
</head>
<body class="lcdp-page-document-legal lcdp-app-page">
  <div id="lcdp-attente-arrivee" role="status" aria-label="Chargement de la page">
    <div class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
  </div>
  <script>
    (() => {
      const terminer = () => document.getElementById('lcdp-attente-arrivee')?.remove();
      window.LCDP_terminerAttenteArrivee = terminer;
      // Sécurité : ne pas bloquer définitivement l'accès en cas d'échec d'un fragment/API.
      window.setTimeout(terminer, 15000);
      window.addEventListener('pageshow', event => { if (event.persisted) terminer(); });
    })();
  </script>

  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>
<main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Page en cours de mise à jour">
        <div class="lcdp-page-container">
          <h2 class="lcdp-boxtext__title lcdp-boxtext__title--center" style="margin-bottom: 24px;">FAQ espace membre</h2>
          <div class="lcdp-section-sommeil" role="status" aria-labelledby="lcdp-section-sommeil-titre">
              <div class="lcdp-section-sommeil__icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4" />
                </svg>
              </div>
              <h1 id="lcdp-section-sommeil-titre" class="lcdp-section-sommeil__titre">Section en sommeil</h1>
              <p class="lcdp-section-sommeil__texte">Nous ne diffusons pas cette page pour le moment. Le club prépare son ouverture.</p>
            </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>
  <script>
    (() => {
      async function fragment(url, slot) {
        const reponse = await fetch(url, {credentials:'omit',cache:'no-cache'});
        if (!reponse.ok) throw new Error('Composant indisponible : ' + url);
        const tmpl = document.createElement('template');
        tmpl.innerHTML = (await reponse.text()).trim();
        slot.replaceChildren(tmpl.content.cloneNode(true));
        slot.querySelectorAll('[data-site-href]').forEach(a => {
          a.href = a.dataset.space === 'membre' ? window.LCDP_urlMembre(a.dataset.siteHref) : window.LCDP_urlPublic(a.dataset.siteHref);
        });
        slot.querySelectorAll('[data-site-src]').forEach(img => {
          img.src = window.LCDP_urlObjet(String(img.dataset.siteSrc || '').replace(/^\/?OBJET\/?/,'/'));
        });
      }
      async function initBandeau() {
        const slot = document.getElementById('lcdp-bandeau-slot');
        await fragment(window.LCDP_urlMembre('/ESPACE-MEMBRE/box-bandeau-nav-membre.html'), slot);
        if (typeof window.LCDP_initialiserMenuBurgerMembre !== 'function') {
          await new Promise((resolve,reject) => {
            const script = document.createElement('script');
            script.src = window.LCDP_urlMembre('/ESPACE-MEMBRE/box-menu-burger-membre.js');
            script.onload = resolve;
            script.onerror = () => reject(new Error('Menu membre indisponible'));
            document.body.appendChild(script);
          });
        }
        if (typeof window.LCDP_initialiserMenuBurgerMembre === 'function') {
          await window.LCDP_initialiserMenuBurgerMembre();
        }
      }
      async function initFooter() {
        await fragment(window.LCDP_urlObjet('/HTMLBASE/02-footer.html'), document.getElementById('lcdp-footer-slot'));
      }
      Promise.allSettled([initBandeau(), initFooter()]).then(resultats => {
        for (const resultat of resultats) {
          if (resultat.status === 'rejected') console.error('[FAQ MEMBRE] Initialisation :', resultat.reason);
        }
        window.LCDP_terminerAttenteArrivee();
      });
    })();
  </script>
</body>
</html>
