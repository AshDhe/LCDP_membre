<!doctype html>
<html lang="fr" data-lcdp-css="c085">
<head>
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/CSSBASE/lcdp-attente.css?v=20261127-page-membre">

  <meta charset="utf-8">

  <title>Mes points - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulter ses points et son statut de référent La Clé du Parc.">

  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const script = document.createElement("script");
      script.src = typeof cfg.objetUrl === "function"
        ? cfg.objetUrl("/JSBASE/affichage-legal.js")
        : "https://lacleduparc.fr/OBJET/JSBASE/affichage-legal.js";
      document.head.appendChild(script);
    })();
  </script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : buildUrl(publicBase, path);
      };

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        return typeof config.membreUrl === "function"
          ? config.membreUrl(path)
          : buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : buildUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css",
        "/CSSBASE/lcdp-lightbox-convergence.css",
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });
    })();
  </script>
</head>
<body class="lcdp-app-page" data-lcdp-suivi-compte="compte-mes-points">
  <div id="lcdp-attente-page-membre" class="lcdp-attente-plein-ecran lcdp-attente-arrivee--simple" hidden role="status" aria-label="Chargement de la page">
    <div class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
  </div>
  <script>
    (() => {
      document.getElementById("lcdp-attente-page-membre").hidden = false;
      const terminer = () => document.getElementById("lcdp-attente-page-membre")?.remove();
      window.LCDP_terminerAttentePageMembre = terminer;
      window.setTimeout(terminer, 15000);
      window.addEventListener("pageshow", event => { if(event.persisted) terminer(); });
    })();
  </script>

  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Mes points">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-page-content--avec-entete lcdp-stack-large">
            <header class="lcdp-page-header">
              <h1 class="lcdp-title-page-center">Mes points</h1>
              <p class="lcdp-mention-connexion">[Espace membre de l'application]</p>
            </header>

            <div id="lcdp-mes-points-slot"></div>
          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>

  <script>
    (() => {
      document.write(
        '<script src="' +
        window.LCDP_urlObjet("/JSBASE/05-table-lecture.js") +
        '"><\/script>'
      );
    })();
  </script>
  <script src="./mes-points.js?v=20261120-lien-abonnement"></script>
</body>
</html>
