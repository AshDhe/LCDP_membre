<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Mes points - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulter ses points et son statut de référent La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        return typeof config.publicUrl === "function"
          ? config.publicUrl(path)
          : buildUrl(publicBase, path);
      };

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        return typeof config.membreUrl === "function"
          ? config.membreUrl(path)
          : buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        return typeof config.objetUrl === "function"
          ? config.objetUrl(path)
          : buildUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/02-box-menu-burger.css",
        "/BOX/02-box-footer.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-dialogue-bouton.css",
        "/BOX/05-wraper-onglets.css",
        "/BOX/05-table-lecture.css?v=20260802-1530"
      ].forEach((path) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(path) +
          '">'
        );
      });
    })();
  </script>
</head>
<body>
  <div class="lcdp-site-page">
    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Mes points">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-page-content--avec-entete lcdp-stack-large">
            <header class="lcdp-page-header">
              <h1 class="lcdp-title-page-center">Mes points</h1>
              <p class="lcdp-mention-connexion">[Espace membre de l'application]</p>
            </header>

            <div id="lcdp-mes-points-slot"></div>
          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>

  <script>
    (() => {
      document.write(
        '<script src="' +
        window.LCDP_urlObjet("/BOX/05-table-lecture.js") +
        '"><\/script>'
      );
    })();
  </script>
  <script src="./mes-points.js?v=20260802-1530"></script>
</body>
</html>
