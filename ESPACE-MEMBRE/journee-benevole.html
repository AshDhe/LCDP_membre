<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c032 c083 c036 c037 c040 c054 c058 c065 c072 c073 c063 c064 c077">
<head>
  <style>
    /* Masquer le wrapper entier avant toute initialisation, comme sur Mes accès. */
    html:not(.lcdp-journee-benevole-ready) body.lcdp-app-page > .lcdp-app-wrapper {display:none!important;}
    /* Début du document : le spinner est centré avant les CSS externes. */
    #lcdp-attente-page-membre {position:fixed;inset:0;z-index:2147483646;box-sizing:border-box;width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:#fff;}
    #lcdp-attente-page-membre .lcdp-loading-spinner {position:relative;box-sizing:border-box;width:64px;height:64px;display:flex;align-items:center;justify-content:center;}
    #lcdp-attente-page-membre .lcdp-loading-spinner > svg {position:absolute;inset:0;display:block;width:100%;height:100%;}
    #lcdp-attente-page-membre .lcdp-loading-spinner__track {color:rgba(6,95,70,.10);}
    #lcdp-attente-page-membre .lcdp-loading-spinner__arc {color:#e59834;animation:lcdp-attente-page-rotation .8s linear infinite;}
    #lcdp-attente-page-membre .lcdp-loading-spinner__dot {width:8px;height:8px;border-radius:50%;background:#4e6838;}
    @keyframes lcdp-attente-page-rotation {to {transform:rotate(360deg);}}
    @media(prefers-reduced-motion:reduce) {#lcdp-attente-page-membre .lcdp-loading-spinner__arc {animation:none;}}
  </style>
  <noscript><style>#lcdp-attente-page-membre{display:none!important;} html:not(.lcdp-journee-benevole-ready) body.lcdp-app-page > .lcdp-app-wrapper{display:block!important;}</style></noscript>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journée bénévole — La Clé du Parc</title>
  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const script = document.createElement("script");
      script.src = typeof cfg.objetUrl === "function"
        ? cfg.objetUrl("/JSBASE/affichage-legal.js")
        : "https://lacleduparc.fr/OBJET/JSBASE/affichage-legal.js";
      document.head.appendChild(script);
    })();
  </script>
  <script>
    (() => {
      "use strict";
      const config = window.SITE_CONFIG || {};
      const nettoyer = value => String(value || "").replace(/\/+$/, "");
      const joindre = (base, path) => nettoyer(base) + "/" + String(path || "").replace(/^\/+/, "");
      const membreBase = nettoyer(config.membreBaseUrl || config.MEMBRE_BASE || config.siteBase || "");
      const publicBase = nettoyer(config.publicBaseUrl || config.PUBLIC_BASE || "");
      const objetBase = nettoyer(config.objetBaseUrl || config.OBJET_BASE || joindre(publicBase, "/OBJET"));

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;
      window.LCDP_urlPublic = path => typeof config.publicUrl === "function" ? config.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof config.membreUrl === "function" ? config.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof config.objetUrl === "function" ? config.objetUrl(path) : joindre(objetBase, path);

      [
        "/CSSBASE/cssbase.css?interface=spinner-officiel",
        "/CSSBASE/lcdp-central-mobile-first.css",
        "/CSSBASE/lcdp-central-module-06.css",
        "/CSSBASE/lcdp-planifier.css",
        "/CSSBASE/lcdp-navigation-onglets.css",
        "/CSSBASE/lcdp-carte-acces-visuel.css",
        "/CSSBASE/lcdp-ui-badges.css?v=20261124-action-ambre",
        "/CSSBASE/lcdp-lightbox-convergence.css",
        "/CSSBASE/lcdp-mes-acces-membre.css",
        "/CSSBASE/lcdp-fiche-parc-wrapper.css?v=20261113-wrapper-unique-v9",
        "/CSSBASE/lcdp-fiche-parc-vue-carte.css?v=20261113-wrapper-unique-v9"
      ].forEach(path => {
        // Comme sur mes-informations.html : conserver l'ordre de cascade CSS
        // avant le style de page, sans chargement asynchrone concurrent.
        const versionVue = path.endsWith("/lcdp-mes-acces-membre.css") ? "?v=20261124-etat-vide-actions-v1" : "";
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(path) + versionVue + '">');
      });
    })();
  </script>
  <script>
    // Sources uniques partagées avec les autres espaces, cascade historique conservée.
    [
      "/CSSBASE/lcdp-theme-espaces.css?v=20261127-commun-v1",
      "/CSSBASE/lcdp-grille-filtrage-acces.css?v=20261127-commun-v1",
      "/CSSBASE/lcdp-alerte-planifier.css?v=20261127-commun-v1"
    ].forEach(path => {
      const href = window.LCDP_urlObjet(path);
      document.write('<link rel="stylesheet" href="' + href.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">');
    });
  </script>
</head>
<body class="lcdp-app-page lcdp-mes-acces-page">
  <div id="lcdp-attente-page-membre" class="lcdp-attente-plein-ecran" role="status" aria-label="Chargement de la page">
    <div class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
  </div>
  <script>
    (() => {
      let termine = false;
      const attente = document.getElementById("lcdp-attente-page-membre");
      const echec = () => {
        if (termine || !attente) return;
        const message = document.createElement("p");
        message.textContent = "Impossible de charger la page. ";
        const reessayer = document.createElement("a");
        reessayer.href = window.location.href;
        reessayer.textContent = "Réessayer";
        message.appendChild(reessayer);
        attente.replaceChildren(message);
        attente.setAttribute("role", "alert");
        attente.removeAttribute("aria-label");
      };
      const minuterie = window.setTimeout(echec, 15000);
      window.LCDP_echecAttentePageMembre = () => { window.clearTimeout(minuterie); echec(); };
      window.LCDP_terminerAttentePageMembre = () => {
        if (termine) return;
        termine = true;
        window.clearTimeout(minuterie);
        document.documentElement.classList.add("lcdp-journee-benevole-ready");
        attente?.remove();
      };
    })();
  </script>

  <div class="lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" aria-label="Journée bénévole">
      <section class="lcdp-page-section">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content">
            <div id="lcdp-planning-calendrier-slot">
<div class="lcdp-box-workflow-reservation lcdp-box-workflow-reservation--planning-page lcdp-box-workflow-reservation--calendrier-mois lcdp-workflow-reservation-box"  data-lcdp-box-workflow-reservation>
  <section class="lcdp-box-workflow-reservation__card" data-lcdp-workflow-reservation-card>
    <div class="lcdp-box-workflow-reservation__content" data-lcdp-workflow-reservation-content>
<section class="lcdp-box-liste-card lcdp-box-liste-card--planning-membre lcdp-box-liste-card--mode-liste lcdp-planning-navigation-permanente" data-lcdp-box-liste-card>
  <div class="lcdp-box-liste-card__header">
    <div class="lcdp-box-liste-card__heading">
      <h2 class="lcdp-box-liste-card__title lcdp-editorial-eyebrow" data-lcdp-liste-card-title>
        Journée bénévole
      </h2>
    </div>

    <div

    <form class="lcdp-planning-filtres" aria-label="Filtres des journées bénévoles" id="lcdp-planning-filtres-contenu" hidden>
      <div class="lcdp-planning-filtres__champs"><div class="lcdp-planning-filtres__champ" data-lcdp-filtre-champ="mois"><label class="lcdp-planning-filtres__label" for="lcdp-planning-filtre-mois">Période</label><select class="lcdp-planning-filtres__select" id="lcdp-planning-filtre-mois" data-lcdp-filtre="mois" disabled><option value="">Tous</option></select></div>
<div class="lcdp-planning-filtres__champ" data-lcdp-filtre-champ="departement"><label class="lcdp-planning-filtres__label" for="lcdp-planning-filtre-departement">Département</label><select class="lcdp-planning-filtres__select" id="lcdp-planning-filtre-departement" data-lcdp-filtre="departement" disabled><option value="">Tous</option></select></div>
<div class="lcdp-planning-filtres__champ" data-lcdp-filtre-champ="parc"><label class="lcdp-planning-filtres__label" for="lcdp-planning-filtre-parc">Parc</label><select class="lcdp-planning-filtres__select" id="lcdp-planning-filtre-parc" data-lcdp-filtre="parc" disabled><option value="">Tous</option></select></div></div>
    </form>
  </div>

  <p
    class="lcdp-box-liste-card__message"
    data-lcdp-liste-card-message role="status">Aucune journée planifiée actuellement</p>

  <div class="lcdp-box-liste-card__list" data-lcdp-liste-card-list></div>
</section>

    </div>
  </section>
</div>

            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>
  <script src="./journee-benevole.js?v=20261126-wrapper-ready-v2"></script>
</body>
