<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Ma clé - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Validation de la clé d'accès La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        if (typeof config.membreUrl === "function") {
          return config.membreUrl(path);
        }

        return buildUrl(membreBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") {
          return config.publicUrl(path);
        }

        return buildUrl(publicBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") {
          return config.objetUrl(path);
        }

        return buildUrl(objetBase, path);
      };

      [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/02-box-menu-burger.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-footer.css",
        "/BOX/03-box-formulaire.css",
        "/BOX/03-box-champ-formulaire.css",
        "/BOX/04-box-dialogue-champ.css"
      ].forEach((chemin) => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(chemin) + '">');
      });
    })();
  </script>

  <link rel="stylesheet" href="./lacleduparc.css">
</head>

<body class="lcdp-page-cle-du-parc">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section">
        <div class="lcdp-page-container">

          <section
            class="lcdp-cle-ecran lcdp-cle-ecran--saisie"
            data-lcdp-cle-screen="checkin"
            aria-label="Validation de la clé"
          >
            <section
              class="lcdp-component lcdp-box-formulaire-page lcdp-box-formulaire-page--compact lcdp-cle-box"
              data-lcdp-box-formulaire-page
            >
              <div class="lcdp-box-formulaire-page__inner">
                <div class="lcdp-box-formulaire">

                  <header class="lcdp-box-formulaire__header">
                    <h1 class="lcdp-box-formulaire__title">Ma clé</h1>

                    <p class="lcdp-mention-connexion">
                      [Espace membre de l'application]
                    </p>
                  </header>

                  <div class="lcdp-box-formulaire__fields lcdp-cle-codes" aria-label="Saisie des codes de la clé">
                    <button class="lcdp-cle-code-field" type="button" data-lcdp-cle-code-button="1">
                      <span class="lcdp-cle-code-field__label">Code n°1</span>
                      <span class="lcdp-cle-code-field__value" data-lcdp-cle-code-value="1">Saisir le code</span>
                    </button>

                    <button class="lcdp-cle-code-field" type="button" data-lcdp-cle-code-button="2">
                      <span class="lcdp-cle-code-field__label">Code n°2</span>
                      <span class="lcdp-cle-code-field__value" data-lcdp-cle-code-value="2">Saisir le code</span>
                    </button>
                  </div>

                  <div class="lcdp-box-formulaire__actions">
                    <button
                      class="lcdp-button-logo"
                      type="button"
                      aria-label="Valider les deux codes"
                      title="Valider les deux codes"
                      data-lcdp-cle-submit
                    >
                      <img
                        class="lcdp-button-logo__image"
                        src="../OBJET/IMAG/LOGO/logo-bouton-navigation-192.webp"
                        data-site-src="/OBJET/IMAG/LOGO/logo-bouton-navigation-192.webp"
                        alt=""
                        aria-hidden="true"
                      >
                      <span class="lcdp-sr-only">Valider</span>
                    </button>
                  </div>

                </div>
              </div>
            </section>
          </section>

          <section
            class="lcdp-cle-ecran lcdp-cle-ecran--active"
            data-lcdp-cle-screen="active"
            aria-label="Clé active"
            hidden
          >
            <section
              class="lcdp-component lcdp-box-formulaire-page lcdp-box-formulaire-page--compact lcdp-cle-box lcdp-cle-box--active"
              data-lcdp-box-formulaire-page
            >
              <div class="lcdp-box-formulaire-page__inner">
                <div class="lcdp-box-formulaire">

                  <header class="lcdp-box-formulaire__header">
                    <h1 class="lcdp-box-formulaire__title">Ma clé</h1>

                    <p class="lcdp-mention-connexion">
                      [Espace membre de l'application]
                    </p>
                  </header>

                  <div class="lcdp-cle-active-actions">
                    <button class="lcdp-button lcdp-cle-action lcdp-cle-action--brighta" type="button" data-lcdp-cle-brighta>
                      BRIGHT-A
                    </button>

                    <p class="lcdp-cle-cooldown" data-lcdp-cle-cooldown aria-live="polite" hidden></p>

                    <button class="lcdp-button lcdp-cle-action lcdp-cle-action--checkout" type="button" data-lcdp-cle-checkout>
                      CHECKOUT
                    </button>
                  </div>

                </div>
              </div>
            </section>
          </section>

        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script src="./lacleduparc.js"></script>
</body>
</html>
