<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Mot de passe membre - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Créer ou modifier le mot de passe de votre compte membre La Clé du Parc.">

  <script>
    window.LCDP_PAGE_MEMBRE_SANS_SESSION = true;
  </script>
  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function joindreBaseEtChemin(baseUrl, chemin) {
        const base = nettoyerBaseUrl(baseUrl);
        const cheminNettoye = "/" + String(chemin || "").replace(/^\/+/, "");

        if (!base) {
          return cheminNettoye;
        }

        return base + cheminNettoye;
      }

      const membreBaseUrl = nettoyerBaseUrl(
        window.SITE_CONFIG?.membreBaseUrl ||
        window.SITE_CONFIG?.MEMBRE_BASE ||
        window.SITE_CONFIG?.siteBase ||
        ""
      );

      const objetBaseUrl = nettoyerBaseUrl(
        window.SITE_CONFIG?.objetBaseUrl ||
        window.SITE_CONFIG?.OBJET_BASE ||
        ""
      );

      window.SITE_BASE = membreBaseUrl;
      window.LCDP_OBJET_BASE = objetBaseUrl;

      function chargerCssObjet(chemin) {
        const href = typeof window.SITE_CONFIG?.objetUrl === "function"
          ? window.SITE_CONFIG.objetUrl(chemin)
          : joindreBaseEtChemin(objetBaseUrl, chemin);

        if (!href) {
          return;
        }

        document.write('<link rel="stylesheet" href="' + href.replace(/"/g, "&quot;") + '">');
      }

      chargerCssObjet("/CSSBASE/cssbase.css");
      chargerCssObjet("/BOX/02-box-alerte.css");
      chargerCssObjet("/BOX/03-box-formulaire.css");
      chargerCssObjet("/BOX/03-box-champ-formulaire.css");
    })();
  </script>


  <style>
    .lcdp-box-formulaire-page--compact .lcdp-box-formulaire-page__inner {
      max-width: 440px;
    }

    @media (min-width: 768px) {
      .lcdp-box-formulaire-page--compact .lcdp-box-formulaire-page__inner {
        max-width: 440px;
      }

    }

    #formulaire-confirmation-mdp[hidden], #formulaire-mdp-membre[hidden] { display: none !important; }
    .lcdp-coda-cases { display: flex; justify-content: center; gap: 12px; margin: 18px 0; }
    .lcdp-coda-cases input { box-sizing: border-box; width: 52px; min-width: 0; height: 60px;
      border: 1px solid var(--lcdp-color-border, #bac1b9); border-radius: 12px;
      background: var(--lcdp-color-surface, #fff); color: var(--lcdp-color-text, #1f2a24);
      font: inherit; font-size: 1.6rem; text-align: center; }
    .lcdp-coda-cases input:focus { outline: 2px solid var(--lcdp-color-primary, #55733f); outline-offset: 3px; }
    .lcdp-coda-mention { text-align: center; }
    @media (max-width: 360px) { .lcdp-coda-cases { gap: 8px; } .lcdp-coda-cases input { width: 44px; height: 54px; } }
  </style>
</head>

<body>
  <div class="lcdp-site-page">

    <main class="lcdp-site-main">
      <section
        class="lcdp-page-section"
        aria-label="Mot de passe du compte membre"
      >
        <div class="lcdp-page-container">

          <section
            class="lcdp-component lcdp-box-formulaire-page lcdp-box-formulaire-page--compact"
            data-lcdp-box-formulaire-page
          >
            <div class="lcdp-box-formulaire-page__inner">

              <form
                id="formulaire-mdp-membre"
                class="lcdp-box-formulaire"
                aria-label="Formulaire de mot de passe membre"
                novalidate
              >
                <header class="lcdp-box-formulaire__header">
                  <h1 class="lcdp-box-formulaire__title">
                    Espace membre
                  </h1>

                  <p
                    class="lcdp-box-formulaire__subtitle"
                    id="texte-mode-mdp"
                  >
                    Mise à jour du mot de passe
                  </p>

                  <div class="lcdp-box-formulaire__intro">
                    <p>
                      Renseignez votre mot de passe, puis validez avec le bouton La Clé du Parc.
                      Vous pourrez ensuite vous connecter depuis "connexion espace membre".
                    </p>
                  </div>
                </header>

                <div class="lcdp-box-formulaire__fields">
                  <div class="lcdp-box-champ-formulaire" data-lcdp-box-champ-formulaire>
                    <div class="lcdp-box-champ-formulaire__label-zone">
                      <label
                        class="lcdp-box-champ-formulaire__label"
                        for="passwordmembre"
                      >
                        Mot de passe
                      </label>
                    </div>

                    <div class="lcdp-box-champ-formulaire__control">
                      <input
                        type="password"
                        id="passwordmembre"
                        name="passwordmembre"
                        placeholder="10 caractères minimum"
                        autocomplete="new-password"
                        required
                      >

                      <label
                        class="lcdp-box-champ-formulaire__checkbox-line"
                        for="afficher-mdp-membre"
                      >
                        <input
                          type="checkbox"
                          id="afficher-mdp-membre"
                        >
                        <span>Afficher le mot de passe</span>
                      </label>

                      <label
                        class="lcdp-box-champ-formulaire__checkbox-line"
                        for="confirmer-utilisateur-unique-mdp"
                      >
                        <input
                          type="checkbox"
                          id="confirmer-utilisateur-unique-mdp"
                          name="confirmerUtilisateurUniqueMdp"
                          required
                        >
                        <span>Je confirme être l'unique utilisateur du mot de passe.</span>
                      </label>
                    </div>
                  </div>
                </div>

                <div class="lcdp-box-formulaire__actions">
                  <button
                    type="submit"
                    id="bouton-valider-formulaire"
                    class="lcdp-button-logo"
                    aria-label="Valider avec La Clé du Parc"
                    title="Valider avec La Clé du Parc"
                  >
                    <img
                      class="lcdp-button-logo__image"
                      src=""
                      data-lcdp-objet-src="/IMAG/LOGO/logo-bouton-navigation-192.webp"
                      alt=""
                      aria-hidden="true"
                    >
                    <span class="lcdp-sr-only">Valider</span>
                  </button>
                </div>
              </form>

              <form id="formulaire-confirmation-mdp" class="lcdp-box-formulaire" hidden novalidate>
                <header class="lcdp-box-formulaire__header">
                  <h1 class="lcdp-box-formulaire__title">Espace membre</h1>
                  <p class="lcdp-box-formulaire__subtitle">Mise à jour du mot de passe</p>
                  <p class="lcdp-coda-mention" id="titre-confirmation-mdp">Confirmer l’opération</p>
                </header>
                <div class="lcdp-coda-cases" role="group" aria-labelledby="titre-confirmation-mdp">
                  <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Chiffre 1" data-coda-case required>
                  <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Chiffre 2" data-coda-case required>
                  <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Chiffre 3" data-coda-case required>
                  <input type="password" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Chiffre 4" data-coda-case required>
                </div>
                <p class="lcdp-coda-mention">Vous avez un seul essai.</p>
                <div class="lcdp-box-formulaire__actions">
                  <button type="submit" id="bouton-confirmer-mdp" class="lcdp-button lcdp-button-primary">Confirmer</button>
                </div>
              </form>


            </div>
          </section>

        </div>
      </section>
    </main>

    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script src="./mdp-membre.js"></script>
</body>
</html>
