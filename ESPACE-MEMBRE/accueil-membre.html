<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Menu membre - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choisir une action dans votre espace membre La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") {
          return config.publicUrl(path);
        }

        return buildUrl(publicBase, path);
      };

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        if (typeof config.membreUrl === "function") {
          return config.membreUrl(path);
        }

        return buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") {
          return config.objetUrl(path);
        }

        return buildUrl(objetBase, path);
      };

      const feuillesCssObjet = [
        "/CSSBASE/cssbase.css",
        "/BOX/02-box-bandeau-nav.css",
        "/BOX/01-box-text.css",
        "/BOX/02-box-menu-burger.css",
        "/BOX/02-box-alerte.css",
        "/BOX/02-box-dialogue-bouton.css",
        "/BOX/04-box-card-abonnement.css",
        "/BOX/02-box-footer.css"
      ];

      feuillesCssObjet.forEach((chemin) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(chemin) +
          '">'
        );
      });
    })();
  </script>
  <style>
    .lcdp-transfert-coda-cases { display: flex; justify-content: center; gap: 10px; margin: 18px 0; }
    .lcdp-transfert-coda-cases input { box-sizing: border-box; width: 48px; min-width: 0; height: 56px;
      border: 1px solid var(--lcdp-color-border, #bac1b9); border-radius: 12px;
      background: var(--lcdp-color-surface, #fff); color: var(--lcdp-color-text, #1f2a24);
      font: inherit; font-size: 1.6rem; text-align: center; }
    .lcdp-transfert-coda-cases input:focus { outline: 2px solid var(--lcdp-color-primary, #55733f); outline-offset: 3px; }
  </style>
  <style>
    #lcdp-actualite-bandeau { margin-top: 24px; }
    #lcdp-accueil-contenu[hidden], #lcdp-accueil-erreur[hidden] { display: none !important; }
    @media (max-width: 767px) {
      .lcdp-page-accueil-membre .lcdp-site-main > .lcdp-page-section {
        padding-top: calc(var(--lcdp-space-5) * 0.82);
      }
    }
  </style>
</head>

<body class="lcdp-page-accueil-membre">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-actualite-bandeau">
      <div class="lcdp-page-container">
        <div class="lcdp-page-content">
          <!-- Réserver deux lignes avant le chargement des actualités. -->
          <div class="lcdp-boxtext__text--center" aria-hidden="true" style="height:3em;min-height:3em;line-height:1.5;overflow:hidden"></div>
        </div>
      </div>
    </div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section">
        <div class="lcdp-page-container">
          <div id="lcdp-accueil-attente" role="status" aria-label="Chargement de votre espace membre" style="display:flex;align-items:center;justify-content:center;min-height:240px">
            <script>document.write('<img src="' + window.LCDP_urlObjet('/BOX/pictowait.gif') + '" alt="" width="64" height="64">');</script>
          </div>
          <div id="lcdp-accueil-erreur" hidden role="alert">
            <p>Impossible de charger votre espace membre.</p>
            <button type="button" class="lcdp-button lcdp-button-primary" onclick="window.location.reload()">Réessayer</button>
          </div>
          <noscript>Activez JavaScript pour accéder à votre espace membre.</noscript>
          <div id="lcdp-accueil-contenu" class="lcdp-page-content lcdp-stack-large" hidden aria-busy="true">

            <p class="lcdp-text-strong-lead lcdp-accueil-mention" id="message-accueil-membre" aria-live="polite">
              Bonjour, c’est à vous.
            </p>

            <p class="lcdp-mention-connexion" id="mention-statut-membre" aria-live="polite">
              
            </p>

            <div id="lcdp-menu-central-slot" class="lcdp-stack"></div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script>
    window.LCDP_echecAccueilMembre = function () {
      document.getElementById("lcdp-accueil-attente").style.display = "none";
      document.getElementById("lcdp-accueil-contenu").hidden = true;
      document.getElementById("lcdp-accueil-erreur").hidden = false;
    };
  </script>
  <script src="./accueil-membre.js?v=20261028-gif1" onerror="window.LCDP_echecAccueilMembre()"></script>
  <script>
    (() => {
      const script = document.createElement("script");
      script.src = window.LCDP_urlPublic("/ESPACE-PUBLIC/actualite.js");
      script.defer = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
