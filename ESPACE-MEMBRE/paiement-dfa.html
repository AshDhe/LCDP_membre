<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Paiement sécurisé – La Clé du Parc</title>
  <meta name="description" content="Paiement sécurisé de votre dotation financière annuelle La Clé du Parc.">
  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const script = document.createElement("script");
      script.src = typeof cfg.objetUrl === "function"
        ? cfg.objetUrl("/JSBASE/affichage-legal.js")
        : "https://lacleduparc.fr/OBJET/JSBASE/affichage-legal.js";
      document.head.appendChild(script);
    })();
  </script>
  <script>
    (function () {
      const c = window.SITE_CONFIG || {};
      const base = String(c.objetBaseUrl || c.OBJET_BASE || 
        (String(c.publicBaseUrl || c.PUBLIC_BASE || '').replace(/\/+$/, '') + '/OBJET')).replace(/\/+$/, '');
      const url = typeof c.objetUrl === 'function'
        ? c.objetUrl('/CSSBASE/lcdp-planifier.css')
        : base + '/CSSBASE/lcdp-planifier.css';
      const link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = url; document.head.appendChild(link);
      window.LCDP_urlObjet = typeof c.objetUrl === 'function' ? c.objetUrl : (p => base + '/' + p.replace(/^\/+/, ''));
    })();
  </script>
  <script defer src="https://js.stripe.com/endive/stripe.js"></script>
  <style>
    .lcdp-stripe__detail-lien{display:block;margin:11px 0 5px auto;padding:3px 0;border:0;background:none;color:#4b6333;text-decoration:underline;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .lcdp-stripe__detail{margin-top:12px;padding:15px 16px;border:1px solid #e7e5e4;border-radius:15px;background:#fafaf9;font-size:13px}
    .lcdp-stripe__detail[hidden]{display:none!important}
    .lcdp-stripe__detail p{margin:0 0 10px;line-height:1.5}
    .lcdp-stripe__detail dl{margin:0;display:grid;gap:9px}
    .lcdp-stripe__detail dl>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
    .lcdp-stripe__detail dt{color:#78716c}
    .lcdp-stripe__detail dd{margin:0;text-align:right;font-weight:700;overflow-wrap:anywhere}
    .lcdp-stripe__detail .lcdp-stripe__detail-total{padding-top:9px;border-top:1px solid #d6d3d1}
    .lcdp-stripe__detail-reference{display:flex;justify-content:space-between;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #e7e5e4;font-size:12px}
    .lcdp-stripe__detail-reference span{color:#78716c}
    .lcdp-stripe__detail-reference strong{text-align:right;overflow-wrap:anywhere}
    .lcdp-stripe__email[hidden], .lcdp-stripe__label[hidden]{display:none!important}
    .lcdp-stripe__reprendre{display:block;width:100%;margin:12px 0 0;padding:13px 15px;border:0;border-radius:12px;background:#4b6333;color:white;font:inherit;font-weight:750;cursor:pointer}
    .lcdp-stripe__reprendre:disabled{opacity:.55;cursor:wait}
    .lcdp-stripe__reprendre[hidden]{display:none!important}
    body.lcdp-stripe-page #paiement-formulaire > h2 {margin-bottom:6px;}
    body.lcdp-stripe-page #paiement-formulaire > .lcdp-stripe__aide {margin:0 0 15px;text-align:left;}
  </style>
  <script defer src="./paiement-dfa.js?v=20261126-dfa-email-v3"></script>
</head>
<body class="lcdp-page-reserver lcdp-stripe-page">
  <main class="lcdp-stripe" aria-labelledby="paiement-titre">
    <header class="lcdp-stripe__entete">
      <span class="lcdp-stripe__logo">
        <img id="logo-lcdp" alt="La Clé du Parc" hidden>
        <span id="logo-attente" aria-hidden="true">LCDP</span>
      </span>
      <div class="lcdp-stripe__marque"><p>La Clé du Parc</p><span>Paiement sécurisé</span></div>
      <span class="lcdp-stripe__test" id="environnement-test" hidden>TEST</span>
    </header>
    <section class="lcdp-stripe__corps">
      <div class="lcdp-stripe__etape">Votre dotation</div>
      <h1 id="paiement-titre">Règlement de votre DFA</h1>
      <p class="lcdp-stripe__commande" id="description-commande">Chargement du montant sécurisé…</p>
      <div class="lcdp-stripe__resume" aria-label="Récapitulatif du règlement">
        <div><span>Référence DFA</span><strong id="numero-commande">—</strong></div>
        <div><span>Montant à payer</span><strong id="montant-commande">—</strong></div>
      </div>
      <form id="paiement-formulaire" novalidate>
        <h2>Payer par carte bancaire</h2>
        <p class="lcdp-stripe__aide">Vos informations bancaires sont saisies directement dans le composant sécurisé Stripe.</p>
        <label class="lcdp-stripe__label" for="email-paiement" hidden>Adresse e-mail</label>
        <input class="lcdp-stripe__email" hidden id="email-paiement" name="email" type="email" autocomplete="email" inputmode="email" placeholder="email@exemple.com" required>
        <div id="stripe-payment-element" aria-label="Formulaire bancaire sécurisé Stripe"></div>
        <p class="lcdp-stripe__erreur" id="paiement-erreur" role="alert" hidden></p>
        <button class="lcdp-stripe__payer" id="bouton-payer" type="submit" disabled>Payer</button>
      </form>
      <button type="button" class="lcdp-stripe__reprendre" id="dfa-abandon">Quitter le paiement</button>
    </section>
    <footer class="lcdp-stripe__pied">Paiement traité par Stripe</footer>
  </main>
</body>
</html>
