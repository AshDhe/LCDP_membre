<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c037 c038 c033 c036 c035 c041 c040 c066 c047 c082">
<head>
  <meta charset="utf-8">

  <title>Paiements en attente - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Régulariser les échéances d’abonnement.">
  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const joindre = (base, chemin) => String(base || "").replace(/\/+$/, "") + "/" + String(chemin).replace(/^\/+/, "");
      const publicBase = cfg.publicBaseUrl || cfg.PUBLIC_BASE || "";
      const membreBase = cfg.membreBaseUrl || cfg.MEMBRE_BASE || cfg.siteBase || "";
      const objetBase = cfg.objetBaseUrl || cfg.OBJET_BASE || joindre(publicBase, "/OBJET");
      window.SITE_BASE = membreBase;
      window.LCDP_urlPublic = path => typeof cfg.publicUrl === "function" ? cfg.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof cfg.membreUrl === "function" ? cfg.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof cfg.objetUrl === "function" ? cfg.objetUrl(path) : joindre(objetBase, path);
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-central-mobile-first.css?v=20261127-impaye-proprietaire') + '">');
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-mon-compte.css?v=20261125-gestion-invitants-v1') + '">');
      document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet('/CSSBASE/lcdp-attente.css?v=20261127-impaye-proprietaire') + '">');
    })();
  </script>
  <script src="./boutique-accessoires-cadre.js?v=20261126" defer></script>
  <script src="./workflow-paiement-impaye.js?v=20261127-impaye-proprietaire" defer></script>
  <script src="./paiements-en-attente.js?v=20261126-v3" defer></script>
</head>
<body class="lcdp-app-page lcdp-page-mon-compte">
  <div id="lcdp-attente-page-membre" class="lcdp-attente-plein-ecran lcdp-attente-arrivee--masque-page lcdp-attente-arrivee--simple" hidden role="status" aria-label="Chargement des paiements en attente">
    <div id="impaye-attente-picto" class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
    <p id="impaye-attente-erreur" hidden>Impossible de charger les paiements en attente. <a href="">Réessayer</a></p>
  </div>
  <script>
    (() => {
      const attente = document.getElementById("lcdp-attente-page-membre");
      const picto = document.getElementById("impaye-attente-picto");
      const erreur = document.getElementById("impaye-attente-erreur");
      attente.hidden = false;
      let termine = false;
      const echec = () => {
        if (termine) return;
        clearTimeout(delai);
        picto.hidden = true;
        erreur.hidden = false;
        attente.setAttribute("role","alert");
        attente.removeAttribute("aria-label");
      };
      const delai = setTimeout(echec, 25000);
      window.LCDP_impayeAttenteErreur = echec;
      window.LCDP_impayeAttenteTerminer = () => {
        if (termine) return;
        termine = true;
        clearTimeout(delai);
        attente.hidden = true;
      };
    })();
  </script>
  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" aria-label="Paiements en attente"></main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>
  <noscript>Activez JavaScript pour consulter vos paiements.</noscript>
</body>
</html>
