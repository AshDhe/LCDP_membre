<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGV - La Clé du Parc</title>
  <meta name="description" content="CGV réservées aux membres de La Clé du Parc.">
  <meta name="robots" content="noindex, nofollow">
  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg=window.SITE_CONFIG||{};
      const base=String(cfg.objetBaseUrl||cfg.OBJET_BASE||(cfg.publicBaseUrl||'')+'/OBJET').replace(/\/+$/,'');
      ['/CSSBASE/cssbase.css','/BOX/01-box-text.css'].forEach(path=>{
        const link=document.createElement('link');link.rel='stylesheet';link.href=base+path;document.head.appendChild(link);
      });
    })();
  </script>
  <style>
    body{margin:0;background:#f7f8f5;color:#26372b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .lcdp-cgv-page{box-sizing:border-box;max-width:760px;margin:clamp(20px,5vw,56px) auto;padding:0 16px 45px}
    .lcdp-cgv-header{background:#fff;border:1px solid #e3e8df;border-radius:15px;padding:20px 24px;margin-bottom:14px}
    .lcdp-cgv-header h1{margin:0;font-size:clamp(1.5rem,4vw,2rem);font-weight:650;color:#294332}
    .lcdp-cgv-header p{margin:10px 0 0;color:#67736a;font-size:.92rem}
    .lcdp-cgv-status{padding:18px 20px;border:1px solid #e3e8df;border-radius:13px;background:#fff;line-height:1.5}
    .lcdp-cgv-section{box-sizing:border-box;margin:12px 0;padding:18px 23px;border:1px solid #e3e8df;border-radius:13px;background:#fff}
    .lcdp-cgv-section h2{margin:0 0 10px;color:#294332;font-size:1.12rem;line-height:1.35;font-weight:650}
    .lcdp-cgv-section__texte{line-height:1.6;overflow-wrap:anywhere;font-size:.98rem}
    .lcdp-cgv-section__texte p{margin:.45em 0 .85em}
    .lcdp-cgv-section__texte a{color:#3f633f;text-decoration:underline}
    .lcdp-cgv-connexion{display:inline-block;margin-top:10px;color:#3f633f;text-decoration:underline}
  </style>
</head>
<body>
  <main class="lcdp-cgv-page">
    <header class="lcdp-cgv-header">
      <h1>CGV</h1>
      <p id="lcdp-cgv-date" hidden></p>
    </header>
    <p id="lcdp-cgv-status" class="lcdp-cgv-status" role="status" aria-live="polite">Chargement des CGV…</p>
    <div id="lcdp-cgv-contenu" hidden></div>
  </main>
  <script src="./cgv-lcdp.js"></script>
</body>
</html>
