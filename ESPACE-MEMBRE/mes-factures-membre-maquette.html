<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c081 c037">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mes factures – Maquette La Clé du Parc</title>
  <link rel="stylesheet" href="https://ashdhe.github.io/LCDP_public/OBJET/CSSBASE/lcdp-central-mobile-first.css">
  <script src="https://ashdhe.github.io/LCDP_public/OBJET/JSBASE/05-wraper-onglets.js" defer></script>
</head>
<body class="lcdp-app-page">
  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot">
      <header class="lcdp-box-bandeau-nav">
        <div class="lcdp-box-bandeau-nav__inner">
          <div class="lcdp-box-bandeau-nav__logo-link">
            <img class="lcdp-box-bandeau-nav__logo" src="https://ashdhe.github.io/LCDP_public/OBJET/IMAG/LOGO/logo-bandeau-96.webp" alt="" width="96" height="96">
            <span class="lcdp-box-bandeau-nav__space-label lcdp-bandeau-restreint-label">
              <span class="lcdp-bandeau-restreint-title">La Clé du Parc</span>
              <span class="lcdp-bandeau-restreint-subtitle">Espace membre</span>
            </span>
          </div>
          <div class="lcdp-box-bandeau-nav__burger-slot">
            <button type="button" class="lcdp-box-menu-burger__button" aria-label="Menu indisponible dans la maquette" disabled><span></span><span></span><span></span></button>
          </div>
        </div>
      </header>
    </div>
    <main class="lcdp-site-main" id="contenu-principal">
      <section class="lcdp-page-section" aria-labelledby="lcdp-page-titre">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large">
            <header class="lcdp-editorial-page-heading">
              <h1 class="lcdp-title-page-center" id="lcdp-page-titre">Mes factures</h1>
              <p class="lcdp-mention-connexion">[Espace membre de l'application]</p>
            </header>
            <section class="lcdp-component lcdp-box-carousel lcdp-editorial-card" aria-labelledby="lcdp-titre-abonnement-factures">
              <h2 class="lcdp-box-carousel__title" id="lcdp-titre-abonnement-factures">Abonnement</h2>
              <div id="lcdp-mes-factures-membre-slot" data-lcdp-wraper-onglets-slot>
                <div class="lcdp-wraper-onglets lcdp-wraper-onglets--3" data-lcdp-wraper-onglets>
  <div class="lcdp-wraper-onglets__navigation" role="tablist" aria-label="Documents de l’abonnement" data-lcdp-wraper-onglets-navigation>
    <button type="button" class="lcdp-wraper-onglets__tab" id="abonnement-tab-factures" role="tab" aria-selected="true" aria-controls="abonnement-panel-factures" tabindex="0" data-lcdp-onglet="factures">Factures et avoirs</button>
    <button type="button" class="lcdp-wraper-onglets__tab" id="abonnement-tab-paiements" role="tab" aria-selected="false" aria-controls="abonnement-panel-paiements" tabindex="-1" data-lcdp-onglet="paiements">Paiements</button>
    <button type="button" class="lcdp-wraper-onglets__tab" id="abonnement-tab-remboursements" role="tab" aria-selected="false" aria-controls="abonnement-panel-remboursements" tabindex="-1" data-lcdp-onglet="remboursements">Remboursements</button>
  </div>
  <div class="lcdp-wraper-onglets__contenu">
    <section class="lcdp-wraper-onglets__panneau" id="abonnement-panel-factures" role="tabpanel" aria-labelledby="abonnement-tab-factures" data-lcdp-panneau-onglet="factures">
      <div data-lcdp-contenu-onglet="factures"><p class="lcdp-mention-connexion">Aucun document archivé.</p></div>
    </section>
    <section class="lcdp-wraper-onglets__panneau" id="abonnement-panel-paiements" role="tabpanel" aria-labelledby="abonnement-tab-paiements" data-lcdp-panneau-onglet="paiements" hidden>
      <div data-lcdp-contenu-onglet="paiements"><p class="lcdp-mention-connexion">Aucun paiement.</p></div>
    </section>
    <section class="lcdp-wraper-onglets__panneau" id="abonnement-panel-remboursements" role="tabpanel" aria-labelledby="abonnement-tab-remboursements" data-lcdp-panneau-onglet="remboursements" hidden>
      <div data-lcdp-contenu-onglet="remboursements"><p class="lcdp-mention-connexion">Aucun remboursement.</p></div>
    </section>
  </div>
</div>
              </div>
            </section>
            <section class="lcdp-component lcdp-box-carousel lcdp-editorial-card" aria-labelledby="lcdp-titre-boutique-factures">
              <h2 class="lcdp-box-carousel__title" id="lcdp-titre-boutique-factures">Boutique</h2>
              <div id="lcdp-mes-factures-boutique-slot" data-lcdp-wraper-onglets-slot>
                <div class="lcdp-wraper-onglets lcdp-wraper-onglets--1" data-lcdp-wraper-onglets>
  <div class="lcdp-wraper-onglets__navigation" role="tablist" aria-label="Documents de la boutique" data-lcdp-wraper-onglets-navigation>
    <button type="button" class="lcdp-wraper-onglets__tab" id="boutique-tab-factures" role="tab" aria-selected="true" aria-controls="boutique-panel-factures" tabindex="0" data-lcdp-onglet="factures">Factures</button>
  </div>
  <div class="lcdp-wraper-onglets__contenu">
    <section class="lcdp-wraper-onglets__panneau" id="boutique-panel-factures" role="tabpanel" aria-labelledby="boutique-tab-factures" data-lcdp-panneau-onglet="factures">
      <div data-lcdp-contenu-onglet="factures"><p class="lcdp-mention-connexion">Aucune facture affichée.</p></div>
    </section>
  </div>
</div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot">
      <footer class="lcdp-box-footer"><div class="lcdp-box-footer__inner"><p class="lcdp-mention-connexion">Maquette visuelle — sans données réelles</p></div></footer>
    </div>
  </div>
  <script>
    // Seule interaction locale : le composant officiel d'onglets.
    // Aucun chargement de config.js, aucune session, aucun appel aux workers.
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.LCDP_WRAPER_ONGLETS) return;
      document.querySelectorAll("[data-lcdp-wraper-onglets]").forEach(racine => {
        const messages = {};
        const onglets = Array.from(racine.querySelectorAll("[data-lcdp-onglet]"), bouton => {
          const key = bouton.dataset.lcdpOnglet;
          messages[key] = racine.querySelector('[data-lcdp-contenu-onglet="' + key + '"]').firstElementChild;
          return {key, label: bouton.textContent.trim()};
        });
        const controleur = window.LCDP_WRAPER_ONGLETS.initialiser({
          racine, idPrefix: racine.parentElement.id,
          ariaLabel: racine.querySelector('[role="tablist"]').getAttribute("aria-label"),
          actif: onglets[0].key, onglets
        });
        onglets.forEach(({key}) => controleur.zones[key].appendChild(messages[key]));
      });
    });
  </script>
</body>
</html>
