<head>
  <meta charset="utf-8">
  <title>Accessoires d’accès - La Clé du Parc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessoires d’accès de la boutique La Clé du Parc.">
  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const joindre = (base, chemin) => String(base || "").replace(/\/+$/, "") + "/" + String(chemin).replace(/^\/+/, "");
      const publicBase = cfg.publicBaseUrl || cfg.PUBLIC_BASE || "";
      const membreBase = cfg.membreBaseUrl || cfg.MEMBRE_BASE || cfg.siteBase || "";
      const objetBase = cfg.objetBaseUrl || cfg.OBJET_BASE || joindre(publicBase, "/OBJET");
      window.SITE_BASE = membreBase;
      window.LCDP_urlPublic = path => typeof cfg.publicUrl === "function" ? cfg.publicUrl(path) : joindre(publicBase, path);
      window.LCDP_urlMembre = path => typeof cfg.membreUrl === "function" ? cfg.membreUrl(path) : joindre(membreBase, path);
      window.LCDP_urlObjet = path => typeof cfg.objetUrl === "function" ? cfg.objetUrl(path) : joindre(objetBase, path);
      for (const chemin of [
        "/CSSBASE/lcdp-central-mobile-first.css?v=20261126-da27f214",
        "/CSSBASE/lcdp-lightbox-convergence.css?v=20261126-conteneur",
        "/CSSBASE/lcdp-planifier.css"
      ]) {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(chemin) + '">');
      }
    })();
  </script>
  <link rel="stylesheet" href="./grille-filtrage-acces.css?v=20261126-commun">
  <script src="./boutique-accessoires-cadre.js?v=20261126" defer></script>
  <script src="./boutique-accessoires.js?v=20261126" defer></script>
</head>

        <svg viewBox="0 0 36 36" class="lcdp-loading-spinner__arc"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75" /></svg>
        <span class="lcdp-loading-spinner__dot"></span>
      </div>
    </div>
  </div>

              <h1 class="lcdp-title-page-center">Accessoires d’accès</h1>
            </header>
            <p id="lcdp-accessoires-etat" role="status" hidden></p>
            <div data-lcdp-accessoires-reserves="acces" class="lcdp-stack-small" hidden>
              <div id="lcdp-planning-calendrier-slot">
                <form class="lcdp-planning-filtres" aria-label="Filtrer les accessoires" data-lcdp-accessoires-filtres>
                  <div class="lcdp-planning-filtres__champs">
                    <div class="lcdp-planning-filtres__champ" data-lcdp-filtre-champ="mois">

                      </select>
                    </div>
                    <div class="lcdp-planning-filtres__champ" data-lcdp-filtre-champ="parc">

                      <select id="lcdp-accessoire-prix" class="lcdp-planning-filtres__select" data-lcdp-accessoire-filtre="prix">

                        <option value="asc">Croissant</option>
                        <option value="desc">Décroissant</option>
                      </select>
                    </div>
                  </div>
                  <div class="lcdp-planning-filtres__actions">

                    <button class="lcdp-planning-filtres__effacer" type="reset">Effacer</button>

                      <div class="lcdp-box-liste-card-diaporama__list" data-lcdp-liste-card-diaporama-list></div>
                    </section>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
