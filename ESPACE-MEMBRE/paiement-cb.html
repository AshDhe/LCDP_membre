<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c037 c038 c033 c036 c035 c041 c040 c066 c047 c082">
<head>
  <meta charset="utf-8">

  <title>Paiement CB - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paiement CB sécurisé La Clé du Parc.">

  <script src="../config.js"></script>
  <script>
    (() => {
      const cfg = window.SITE_CONFIG || {};
      const script = document.createElement("script");
      script.src = typeof cfg.objetUrl === "function"
        ? cfg.objetUrl("/JSBASE/affichage-legal.js")
        : "https://lacleduparc.fr/OBJET/JSBASE/affichage-legal.js";
      document.head.appendChild(script);
    })();
  </script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(config.membreBaseUrl || config.MEMBRE_BASE || config.siteBase || "");
      const publicBase = nettoyerBaseUrl(config.publicBaseUrl || config.PUBLIC_BASE || "");
      const objetBase = nettoyerBaseUrl(config.objetBaseUrl || config.OBJET_BASE || buildUrl(publicBase, "/OBJET"));

      window.SITE_BASE = membreBase;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        if (typeof config.membreUrl === "function") return config.membreUrl(path);
        return buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") return config.objetUrl(path);
        return buildUrl(objetBase, path);
      };

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") return config.publicUrl(path);
        return buildUrl(publicBase, path);
      };
      ["/CSSBASE/lcdp-central-mobile-first.css",
       "/CSSBASE/lcdp-mon-compte.css?v=20261125-gestion-invitants-v1",
       "/CSSBASE/lcdp-ui-badges.css?v=20261124-action-retractation",
       "/CSSBASE/lcdp-lightbox-convergence.css?v=20261126-spinner-v8"].forEach(chemin => {
        document.write('<link rel="stylesheet" href="' + window.LCDP_urlObjet(chemin) + '">');
      });
    })();
  </script>

</head>

<body data-lcdp-suivi-vt-abo="vt-paiement-cb" class="lcdp-page-mon-compte lcdp-app-page">
  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main">
      <section class="lcdp-page-section" data-lcdp-compte-parcours aria-label="Paiement CB">
        <div class="lcdp-page-container">
          <div data-lcdp-compte-parcours-contenu data-lcdp-paiement-cb>
            <p class="lcdp-dialogue-ref__message" role="status">Chargement du paiement…</p>
          </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>
  <script src="./paiement-cb.js?v=20261126-spinner-v8"></script>
</body>
</html>
