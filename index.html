<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Espace membre - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redirection vers le menu membre La Clé du Parc.">

  <script src="./config.js"></script>
  <script>
    (() => {
      const h = location.hostname;
      const base = h === "ashdhe.github.io" || h === "huguespavret.github.io"
        ? location.origin + "/LCDP_public" : "https://lacleduparc.fr";
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = base + "/OBJET/CSSBASE/lcdp-wrapper.css";
      document.head.appendChild(link);
    })();
  </script>
  <noscript><link rel="stylesheet" href="https://lacleduparc.fr/OBJET/CSSBASE/lcdp-wrapper.css"></noscript>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};
      const cheminAccueil = "/ESPACE-MEMBRE/accueil-membre.html";

      if (typeof config.membreUrl === "function") {
        window.location.replace(config.membreUrl(cheminAccueil));
        return;
      }

      const base = String(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      ).replace(/\/+$/, "");

      window.location.replace(base + cheminAccueil);
    })();
  </script>
</head>
<body class="lcdp-app-page">
  <div class="lcdp-app-wrapper lcdp-app-wriper--sans">
    <main class="lcdp-site-main">
      <section class="lcdp-page-section"><p>Redirection vers l’espace membre…</p></section>
    </main>
  </div>
</body>
</html>
